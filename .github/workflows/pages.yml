name: Online demo (GitHub Pages)

# Καταγράφει το `netwatch.py --demo` (προσομοίωση, χωρίς root) και ανεβάζει ένα στατικό,
# χωρίς backend, αντίγραφο του dashboard στο https://<user>.github.io/<repo>/.
# Μία φορά: Settings → Pages → Source: «GitHub Actions».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Record demo mode (simulated traffic)
        run: python tools/record_static_demo.py --seconds 150
      - name: Build the live demo into dist-pages/app
        run: python tools/build_static_demo.py --out dist-pages/app --repo-url "https://github.com/${{ github.repository }}#readme"
      - name: Put the landing page at the site root
        run: cp -r site/. dist-pages/
      - name: Server log (on failure)
        if: failure()
        run: cat build/static-demo/server.log || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
