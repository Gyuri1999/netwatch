name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Replay sample PCAP through the detection engine
        run: |
          python tools/make_sample_pcap.py /tmp/ci.pcap
          python -c "
          import netwatch as n
          me, gw = n.pcap_guess('/tmp/ci.pcap')
          s = n.NetState('pcap', 'ci', [me], gw, geo=False, rdns=False)
          n.pcap_replay(s, '/tmp/ci.pcap', speed=0)
          assert s.alert_seq >= 8, s.alert_seq
          "
