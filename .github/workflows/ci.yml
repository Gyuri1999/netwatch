name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]   # 3.9 = η Python του macOS (εφαρμογή Mac)
    steps:
      - uses: actions/checkout@v4
      # το setup-python δεν έχει πια 3.9 για νέα Ubuntu· το uv κατεβάζει όποια έκδοση θέλουμε
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Replay sample PCAP through the detection engine
        run: |
          python tools/make_sample_pcap.py /tmp/ci.pcap
          python -c "
          import netwatch as n
          me, gw = n.pcap_guess('/tmp/ci.pcap')
          s = n.NetState('pcap', 'ci', [me], gw, geo=False, rdns=False)
          n.pcap_replay(s, '/tmp/ci.pcap', speed=0)
          assert s.alert_seq >= 8, s.alert_seq
          "

  windows:
    # Windows 11 / Server 2022: tests, εκκίνηση σε demo και αναπαραγωγή pcap (χωρίς Npcap — δεν χρειάζεται εδώ)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Replay sample PCAP through the detection engine
        run: |
          python tools/make_sample_pcap.py ci.pcap
          python -c "import netwatch as n; me, gw = n.pcap_guess('ci.pcap'); s = n.NetState('pcap', 'ci', [me], gw, geo=False, rdns=False); n.pcap_replay(s, 'ci.pcap', speed=0); assert s.alert_seq >= 8, s.alert_seq"
      - name: Demo mode serves the UI
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'netwatch.py','--demo','--no-open','--no-intel','--port-file','port.txt' -PassThru -RedirectStandardOutput demo.log -RedirectStandardError demo.err
          for ($i = 0; $i -lt 60 -and -not (Test-Path port.txt); $i++) { Start-Sleep -Milliseconds 500 }
          $port = Get-Content port.txt
          $r = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          Stop-Process -Id $p.Id -Force
          Get-Content demo.log -Tail 5
          if ($r.StatusCode -ne 200) { exit 1 }
      - name: Windows network helpers on a real host
        run: python -c "import winplat as w; w.install_subprocess_defaults(); print(w.detect_net()); print(w.arp_table()[:3]); print(w.ping('127.0.0.1', 2, 1000))"

  academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lessons load and are consistent
        run: node tools/check_academy.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10   # καρφωμένο: το signed OTA θέλει mbedtls 3.x
      # Η κοινή βιβλιοθήκη firmware/common (signed OTA) δίνεται με --library.
      # Κάθε sketch χτίζεται δύο φορές: OTA_ENABLE 0 (προεπιλογή) και OTA_ENABLE 1.
      - name: Compile NetWatch Sentinel (OTA off / on)
        run: |
          cp firmware/esp32-sentinel/secrets.example.h firmware/esp32-sentinel/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/esp32-sentinel
          sed -i 's/^#define OTA_ENABLE 0/#define OTA_ENABLE 1/' firmware/esp32-sentinel/secrets.h
          grep -q '^#define OTA_ENABLE 1' firmware/esp32-sentinel/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --library firmware/common firmware/esp32-sentinel
      - name: Compile NetWatch Canary (OTA off / on)
        run: |
          cp firmware/esp32-canary/secrets.example.h firmware/esp32-canary/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/esp32-canary
          sed -i 's/^#define OTA_ENABLE 0/#define OTA_ENABLE 1/' firmware/esp32-canary/secrets.h
          grep -q '^#define OTA_ENABLE 1' firmware/esp32-canary/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --library firmware/common firmware/esp32-canary
      # 🧰 Αισθητήρες της εργαλειοθήκης τεχνικού (πρωτόκολλο «Οι συσκευές μου», firmware/common/nw_probe.h)
      - name: Compile tech-kit sensors (rack, PoE, BLE, LoRa node + gateway)
        run: |
          for s in rack poe ble lora-node lora-gw; do cp firmware/esp32-$s/secrets.example.h firmware/esp32-$s/secrets.h; done
          arduino-cli compile --fqbn esp32:esp32:esp32 --library firmware/common firmware/esp32-rack
          arduino-cli compile --fqbn esp32:esp32:esp32-poe --library firmware/common firmware/esp32-poe
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --library firmware/common firmware/esp32-ble
          arduino-cli compile --fqbn esp32:esp32:esp32 --library firmware/common firmware/esp32-lora-node
          arduino-cli compile --fqbn esp32:esp32:esp32 --library firmware/common firmware/esp32-lora-gw
