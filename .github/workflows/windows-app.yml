name: Windows app

# Χτίζει το NetWatch.exe (dist/NetWatch-windows-x64.zip), το δοκιμάζει (--selftest: backend σε demo)
# και το ανεβάζει ως artifact. Σε tag v* το επισυνάπτει και στο GitHub Release.
on:
  push:
    branches: [main, windows-support]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # αλλιώς το app γράφει την έκδοση του αρχείου VERSION στο repo (και ο updater συγκρίνει λάθος)
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+(\.\d+)?$') { Write-Error "tag must look like v1.2.0"; exit 1 }
          Set-Content -Path VERSION -Value $v -NoNewline -Encoding ascii
      - name: Build
        shell: pwsh
        run: ./winapp/build.ps1
      - name: Self-test (the built app starts its backend in demo mode)
        shell: pwsh
        run: |
          $p = Start-Process dist\NetWatch\NetWatch.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\NetWatch\selftest.txt"
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\NetWatch\netwatch.log" -Tail 40; exit 1 }
      - name: Preflight (all required files are in the built app)
        shell: pwsh
        run: |
          $p = Start-Process dist\NetWatch\NetWatch.exe -ArgumentList '--preflight' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error 'preflight failed on a complete build'; exit 1 }
      - name: Self-test from a folder with Greek letters and spaces (e.g. user "Γιώργος")
        shell: pwsh
        # Πολλά ελληνικά Windows έχουν όνομα χρήστη με ελληνικά: C:\Users\Γιώργος\Λήψεις\… — δεν είχε δοκιμαστεί ποτέ
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'Χρήστης Γιώργος'
          $dl = Join-Path $base 'Λήψεις\NetWatch εφαρμογή'
          $local = Join-Path $base 'AppData\Local'
          New-Item -ItemType Directory -Force $dl, $local | Out-Null
          Copy-Item -Recurse dist\NetWatch\* $dl
          $old = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $local
          $p = Start-Process (Join-Path $dl 'NetWatch.exe') -ArgumentList '--selftest' -Wait -PassThru
          $env:LOCALAPPDATA = $old
          $res = Join-Path $local 'NetWatch\selftest.txt'
          if (Test-Path $res) { Get-Content $res -Encoding utf8 } else { Write-Host 'no selftest.txt' }
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $local 'NetWatch\netwatch.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 -Encoding utf8 }
            Write-Error 'self-test failed in a Greek-named folder'; exit 1
          }
      - name: A file removed by antivirus gives a clear failure, not silence
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'av-removed'
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item -Recurse dist\NetWatch $t
          Remove-Item (Join-Path $t 'NetWatch\python\python.exe')
          $p = Start-Process (Join-Path $t 'NetWatch\NetWatch.exe') -ArgumentList '--preflight' -Wait -PassThru
          if ($p.ExitCode -ne 1) { Write-Error "preflight should fail when python.exe is missing (exit $($p.ExitCode))"; exit 1 }
      - name: Agent mode certificate with the bundled Python (no openssl on PATH)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $d = Join-Path $env:RUNNER_TEMP 'agentcert'
          & dist\NetWatch\python\python.exe -c "import sys; sys.path.insert(0, r'dist\NetWatch\app'); import agent; c, k, fp = agent.ensure_cert(sys.argv[1]); agent.tls_context(c, k); print('cert OK', fp)" $d
          if ($LASTEXITCODE) { exit 1 }
      - name: Self-update folder swap (apply script on a copy of the app)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'upd'
          New-Item -ItemType Directory -Force "$t\new" | Out-Null
          Copy-Item -Recurse dist\NetWatch "$t\NetWatch"
          Copy-Item -Recurse dist\NetWatch "$t\new\NetWatch"
          Set-Content "$t\new\NetWatch\marker.txt" 'new'
          $ps1 = Join-Path $t 'apply.ps1'
          python -c "import sys; sys.path.insert(0, 'winapp'); import launcher; open(sys.argv[1], 'w', encoding='utf-8-sig').write(launcher.APPLY_PS1)" $ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -WaitPid 0 -Bundle "$t\NetWatch" -New "$t\new\NetWatch" -Log "$t\log.txt" -NoStart
          Get-Content "$t\log.txt"
          if (-not (Test-Path "$t\NetWatch\marker.txt") -or -not (Test-Path "$t\NetWatch.previous\NetWatch.exe")) { Write-Error 'swap failed'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-windows-x64
          path: dist/NetWatch-windows-x64.zip

  release:
    # Σε tag: SHA-256 του zip, υπογραφή με το ίδιο κλειδί με το Mac (ο updater των Windows το ελέγχει
    # με το update_signers που έχει ήδη μέσα του) και επισύναψη στο GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NetWatch-windows-x64
          path: dist
      - name: Checksum and sign
        env:
          KEY: ${{ secrets.NETWATCH_RELEASE_KEY }}
        run: |
          cd dist
          sha256sum NetWatch-windows-x64.zip > SHA256SUMS-windows
          cat SHA256SUMS-windows
          if [ -n "$KEY" ]; then
            umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
            ssh-keygen -Y sign -f "$RUNNER_TEMP/k" -n netwatch-update SHA256SUMS-windows
            rm -f "$RUNNER_TEMP/k"
            ssh-keygen -Y verify -f ../update_signers -I netwatch-release -n netwatch-update -s SHA256SUMS-windows.sig < SHA256SUMS-windows
          else
            echo "::warning::NETWATCH_RELEASE_KEY not set — Windows release is unsigned, the app will not self-update"
          fi
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        # Το release το δημιουργεί το release.yml (macOS): περίμενε έως 15′ να υπάρξει, αντί να αποτύχεις
        run: |
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            echo "release $GITHUB_REF_NAME not created yet - waiting..."; sleep 15
          done
          cd dist
          FILES="NetWatch-windows-x64.zip SHA256SUMS-windows"; [ -f SHA256SUMS-windows.sig ] && FILES="$FILES SHA256SUMS-windows.sig"
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber
