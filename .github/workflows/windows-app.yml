name: Windows app

# Χτίζει το NetWatch.exe (dist/NetWatch-windows-x64.zip), το δοκιμάζει (--selftest: backend σε demo)
# και το ανεβάζει ως artifact. Σε tag v* το επισυνάπτει και στο GitHub Release.
on:
  push:
    branches: [main, windows-support]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./winapp/build.ps1
      - name: Self-test (the built app starts its backend in demo mode)
        shell: pwsh
        run: |
          $p = Start-Process dist\NetWatch\NetWatch.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\NetWatch\selftest.txt"
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA\NetWatch\netwatch.log" -Tail 40; exit 1 }
      - name: Agent mode certificate with the bundled Python (no openssl on PATH)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          $d = Join-Path $env:RUNNER_TEMP 'agentcert'
          & dist\NetWatch\python\python.exe -c "import sys; sys.path.insert(0, r'dist\NetWatch\app'); import agent; c, k, fp = agent.ensure_cert(sys.argv[1]); agent.tls_context(c, k); print('cert OK', fp)" $d
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-windows-x64
          path: dist/NetWatch-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/NetWatch-windows-x64.zip --clobber
