<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetWatch</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="/edu.js"></script>
<script src="/academy/engine.js"></script>
<style>
:root{--bg:#05080f;--panel:#0b111c;--panel2:#101828;--line:#1c2638;--txt:#cfe0f5;--dim:#6d7f99;
  --cyan:#3ec5ff;--green:#3ddc97;--yellow:#ffd23f;--orange:#ff9f43;--red:#ff3b5c;--purple:#b388ff;--pink:#ff6ad5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b1424,#070b14)}
.logo{font-weight:800;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 12px #3ec5ff88;white-space:nowrap}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px}
.live{background:#ff3b5c22;color:var(--red);border:1px solid #ff3b5c66}.demo{background:#ffd23f22;color:var(--yellow);border:1px solid #ffd23f66}
.chip{display:flex;flex-direction:column;line-height:1.1;padding:0 10px;border-left:1px solid var(--line);white-space:nowrap}
.chip b{font-size:15px;color:#fff}.chip span{font-size:10px;color:var(--dim);text-transform:uppercase}
#status{margin-left:auto;padding:4px 10px;border-radius:5px;font-weight:700;font-size:12px;white-space:nowrap}
.st-ok{background:#3ddc9722;color:var(--green);border:1px solid #3ddc9755}.st-warn{background:#ffd23f22;color:var(--yellow);border:1px solid #ffd23f55}
.st-bad{background:#ff3b5c33;color:#ff8da0;border:1px solid var(--red);animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 18px #ff3b5c}}
main{display:flex;height:calc(100% - 52px)}
#viz{position:relative;flex:1;min-width:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
canvas#c:active{cursor:grabbing}
aside{width:470px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
nav{display:flex;align-items:stretch;border-bottom:1px solid var(--line);position:relative}
.curtab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;border-bottom:2px solid var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curtab:empty{border-color:transparent}
nav .menu-btn{color:var(--txt)}nav .menu-btn.open{color:#fff;background:#3ec5ff18}
.menu{display:none;position:absolute;top:100%;left:0;right:0;z-index:60;background:var(--panel);border:1px solid var(--line);border-top:0;padding:10px;max-height:75vh;overflow:auto;box-shadow:0 12px 30px #000a}
.menu.open{display:block}.menu h4,.mgroup{margin:8px 0 5px;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;cursor:pointer;white-space:normal;line-height:1.35}
.mcard:hover{border-color:#3ec5ff88}.mcard.on{border-color:var(--cyan);background:#3ec5ff14}
.mcard b{display:block;color:#fff;font-size:12px;font-weight:600}.mcard span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
nav button{flex:none;background:none;border:0;color:var(--dim);padding:7px 10px;font:inherit;font-size:11.5px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--txt)}nav button.on{color:#fff;border-color:var(--cyan);background:#ffffff06}
nav .cnt{background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:4px}
.tab{display:none;flex:1;overflow:auto;padding:10px 12px}.tab.on{display:block}
#tip{position:absolute;pointer-events:none;background:#0b111cf2;border:1px solid var(--line);padding:8px 10px;border-radius:6px;display:none;max-width:340px;z-index:5}
#legend{position:absolute;right:10px;top:10px;background:#0b111ccc;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px}
#legend div{display:flex;align-items:center;gap:6px}#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#zc{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:4px}
#zc button{width:34px;height:34px;background:#0b111ce6;border:1px solid #2d3b55;color:var(--txt);border-radius:6px;font-size:16px;cursor:pointer}
#zc button:hover{border-color:var(--cyan);color:#fff}
#zl{position:absolute;right:52px;bottom:14px;color:var(--dim);font-size:11px;background:#0b111ccc;padding:2px 6px;border-radius:4px}
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:10;width:min(560px,90%)}
.toast{background:#2a0910f2;border:1px solid var(--red);border-radius:6px;padding:10px 12px;box-shadow:0 0 30px #ff3b5c55;animation:in .3s ease-out;cursor:pointer}
@keyframes in{from{transform:translateY(-12px);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .6s}
.al{border:1px solid var(--line);border-left:4px solid var(--dim);border-radius:5px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.al.high{border-left-color:var(--red)}.al.med{border-left-color:var(--orange)}.al.low{border-left-color:var(--yellow)}
.al .h{display:flex;justify-content:space-between;gap:8px}.al .ty{font-weight:700;color:#fff}.al .tm{color:var(--dim);font-size:11px}
.al .act{margin-top:6px;display:flex;gap:6px}
.sev{font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;margin-right:6px}
.sev.high{background:var(--red);color:#fff}.sev.med{background:var(--orange);color:#000}.sev.low{background:var(--yellow);color:#000}
.edu{background:#0a1a2a;border:1px solid #1d3a5a;border-radius:5px;padding:8px 10px;margin-top:6px;font-size:12px}
.edu b{color:var(--cyan)}.edu ul{margin:4px 0 0 18px;padding:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:-10px;background:var(--panel);text-align:left;color:var(--dim);font-weight:500;padding:4px;cursor:pointer}
td{padding:4px;border-top:1px solid #141d2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
tr.r{cursor:pointer}tr.r:hover td{background:#13203a}tr.bad td{color:var(--red)}
tr.ex td{white-space:normal;background:#0a1a2a;color:#cfe0f5;max-width:none}
input.f{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 8px;border-radius:4px;font:inherit;margin-bottom:8px}
.kv{display:grid;grid-template-columns:125px 1fr;gap:4px 10px;margin:8px 0}.kv>span:nth-child(odd){color:var(--dim)}.kv span{overflow-wrap:anywhere}
h3{margin:16px 0 6px;font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
h2{margin:4px 0;font-size:18px;color:#fff;overflow-wrap:anywhere}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;margin:2px 4px 2px 0;font-size:11px;background:#1a2538}
.tag.r{background:#ff3b5c33;color:#ff8da0}.tag.y{background:#ffd23f22;color:var(--yellow)}.tag.g{background:#3ddc9722;color:var(--green)}
.links a{color:var(--cyan);margin-right:10px;text-decoration:none;display:inline-block;margin-bottom:4px}.links a:hover{text-decoration:underline}
button.b{background:#13203a;border:1px solid #2d3b55;color:var(--txt);padding:4px 9px;border-radius:4px;font:inherit;font-size:11px;cursor:pointer}
button.b:hover{border-color:var(--cyan)}
pre{white-space:pre-wrap;background:#060a12;border:1px solid var(--line);padding:8px;border-radius:4px;font-size:11px;max-height:340px;overflow:auto}
.bar{height:6px;background:#1a2538;border-radius:3px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%}
.brow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}.brow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed td{max-width:none;font-size:11px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px}
.card.click{cursor:pointer}.card.click:hover{border-color:#2d3b55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:20px;color:#fff;font-weight:700}.sm{font-size:11px;color:var(--dim)}
.verdict{border-left:3px solid var(--red);background:#2a091033;padding:8px 10px;border-radius:4px;margin:8px 0}
.hit{margin-bottom:6px}.hit .why{font-size:11px;color:#9fb4d0}
details{background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{cursor:pointer;padding:8px 10px;font-weight:700;color:#fff}details>div{padding:0 10px 10px}
details details{background:#0a1220}
.lvl{font-size:10px;padding:0 5px;border-radius:3px;background:#1a2538;color:var(--dim);margin-left:6px}
canvas.ch{width:100%;height:120px;display:block}
a.mitre{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#2b1a4a;color:#c9a8ff;text-decoration:none;border:1px solid #4a2f7a}
a.mitre:hover{border-color:#b388ff}
.tactic{display:inline-block;vertical-align:top;width:calc(50% - 4px);margin:0 4px 8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px}
.tactic.hit{border-color:#4a2f7a;background:#1a1030}
/* Στενό παράθυρο: ο χάρτης πάνω, ο πίνακας με τις καρτέλες από κάτω (όχι κρυμμένος). Το 🗺 τον κρύβει/δείχνει. */
.mapbtn{display:none}
@media (max-width:900px){
  main{flex-direction:column}
  #viz{flex:none;height:40%;min-height:180px}
  aside{width:auto;flex:1;min-height:0;border-left:0;border-top:1px solid var(--line)}
  body.mapoff #viz{display:none}
  .mapbtn{display:block}
  .chip:nth-of-type(n+4){display:none}
  .menu{max-height:60vh}
  #toasts .toast:not(:first-child){display:none}.toast{padding:6px 9px;font-size:11px}.toast .sm{display:none}
  #zc{flex-direction:row;bottom:8px;right:8px}#zl{bottom:44px;right:8px}#legend{transform:scale(.85);transform-origin:top right}
}
@media (max-width:600px){
  header{gap:8px;padding:0 10px}.chip,#spark,#legend,#zl{display:none}
  .logo{letter-spacing:1px;font-size:12px}#status{font-size:11px;padding:3px 7px}
  nav button{padding-left:8px;padding-right:8px}
  #zc button{width:28px;height:28px}
}
</style>
</head>
<body>
<header>
  <div class="logo">◉ NETWATCH</div>
  <span id="mode" class="badge live">LIVE</span>
  <div class="chip"><span>interface / εγώ</span><b id="iface" style="font-size:12px">—</b></div>
  <div class="chip"><span>πακέτα/s</span><b id="pps">0</b></div>
  <div class="chip"><span>κίνηση</span><b id="bps">0</b></div>
  <div class="chip"><span>hosts</span><b id="nh">0</b></div>
  <div class="chip"><span>επιθέσεις</span><b id="na" style="color:var(--red)">0</b></div>
  <canvas id="spark" width="160" height="34"></canvas>
  <div id="status" class="st-ok">✓ Όλα καλά</div>
</header>
<main>
  <section id="viz">
    <canvas id="c"></canvas>
    <div id="flash"></div>
    <div id="tip"></div>
    <div id="toasts"></div>
    <div id="legend"></div>
    <div id="zl">×1.0</div>
    <div id="zc">
      <button id="zin" title="Μεγέθυνση (ή ροδέλα ποντικιού)">+</button>
      <button id="zout" title="Σμίκρυνση">−</button>
      <button id="zhome" title="Ζουμ στο σπίτι μου">⌂</button>
      <button id="zatk" title="Ζουμ στους επιτιθέμενους">🎯</button>
      <button id="zreset" title="Όλος ο κόσμος">⟲</button>
      <button id="zlan" title="Εμφάνιση/απόκρυψη LAN">▣</button>
      <button id="zshot" title="Αποθήκευση εικόνας του χάρτη (PNG)">📸</button>
    </div>
  </section>
  <aside>
    <nav>
      <button data-t="home" class="on">🧭 Αρχική</button>
      <button data-t="alerts">⚠ Επιθέσεις<span class="cnt" id="ac" style="display:none">0</span></button>
      <span id="curtab" class="curtab"></span>
      <button id="map-btn" class="mapbtn" title="Απόκρυψη/εμφάνιση χάρτη">🗺</button>
      <button id="menu-btn" class="menu-btn" title="Όλες οι ενότητες">☰ Ενότητες</button>
      <div id="menu" class="menu"></div>
    </nav>
    <div class="tab" id="t-alerts"><div class="empty">Καμία επίθεση ακόμα. Παρακολουθώ… 👀</div></div>
    <div class="tab" id="t-hosts">
      <input class="f" id="hf" placeholder="φίλτρο: IP, domain, χώρα, ISP…">
      <table><thead><tr><th data-s="ip">Host</th><th data-s="name">Domain</th><th data-s="cc">Χώρα</th><th data-s="bytes">Bytes</th></tr></thead><tbody id="hb"></tbody></table>
    </div>
    <div class="tab" id="t-devs"></div>
    <div class="tab" id="t-stats"></div>
    <div class="tab feed" id="t-feed">
      <div class="sm" style="margin-bottom:6px">Κάνε κλικ σε ένα πακέτο για να σου εξηγήσω τι κάνει. <label><input type="checkbox" id="fpause"> παύση</label> <label><input type="checkbox" id="fbad"> μόνο επιθέσεις</label></div>
      <table><thead><tr><th>ώρα</th><th>proto</th><th>από → προς</th><th>len</th></tr></thead><tbody id="fb"></tbody></table>
    </div>
    <div class="tab" id="t-det"><div class="empty">Κάνε κλικ σε έναν κόμβο στον χάρτη ή σε μια γραμμή για αναλυτικά στοιχεία (OSINT).</div></div>
    <div class="tab" id="t-learn"></div>
    <div class="tab" id="t-academy"></div>
    <div class="tab" id="t-apps"></div>
    <div class="tab" id="t-honey"></div>
    <div class="tab" id="t-block"></div>
    <div class="tab" id="t-iot"></div>
    <div class="tab" id="t-sensor"></div>
    <div class="tab" id="t-mqtt"></div>
    <div class="tab" id="t-tips"></div>
    <div class="tab" id="t-hist"></div>
    <div class="tab" id="t-audit"></div>
    <div class="tab" id="t-quiz"></div>
    <div class="tab" id="t-pentest"></div>
    <div class="tab" id="t-rules"></div>
    <div class="tab" id="t-ctf"></div>
    <div class="tab" id="t-wifi"></div>
    <div class="tab on" id="t-home"></div>
    <div class="tab" id="t-priv"></div>
  </aside>
</main>
<script>
const COLORS={HTTPS:'#3ec5ff',HTTP:'#4d7cff',QUIC:'#b388ff',DNS:'#3ddc97',ICMP:'#ffd23f',ICMPv6:'#ffd23f',ARP:'#ff9f43',
  mDNS:'#2fb48a',SSDP:'#ff6ad5',DHCP:'#ffffff',NTP:'#9be7ff',SSH:'#ff7b9c',TCP:'#5fa8d3',UDP:'#ff6ad5'};
const LEG=[['HTTPS/TLS','#3ec5ff'],['HTTP','#4d7cff'],['QUIC','#b388ff'],['DNS','#3ddc97'],['UDP άλλο','#ff6ad5'],['ICMP','#ffd23f'],['ARP','#ff9f43'],['Επίθεση','#ff3b5c']];
document.getElementById('legend').innerHTML=LEG.map(([n,c])=>`<div><i style="background:${c};box-shadow:0 0 6px ${c}"></i>${n}</div>`).join('')+'<div class="sm" style="margin-top:4px">ροδέλα = zoom · σύρε = μετακίνηση</div>';

const S={hosts:new Map(),alerts:[],home:null,me:new Set(),gw:null,sel:null,feed:[],links:new Map(),stats:{},spark:[],hist:[],unread:0,mode:'live',showLan:true,openEdu:new Set(),feedEx:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt())):'';
const fmtB=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const fmtT=t=>new Date(t*1000).toLocaleTimeString('el-GR');
const fmtDur=s=>s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+' λεπτά':(s/3600).toFixed(1)+' ώρες';
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const hname=h=>h?(h.names&&h.names[0])||h.rdns||'':'';
function who(ip){const h=S.hosts.get(ip);if(!h)return ip;if(h.me)return'Εσύ ('+ip+')';if(h.gw)return'ο router ('+ip+')';
  const n=hname(h);const g=h.geo;const base=n?n+' ('+ip+')':h.kind==='bcast'?'όλους/ομάδα ('+ip+')':ip;return base+(g?' '+flag(g.countryCode)+' '+g.country:'')}
const randMac=m=>m&&/^.[26ae]/i.test(m);

// ================= MAP + ZOOM =================
const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,proj,mapImg,world110=null,world50=null,loading50=false,ZT=d3.zoomIdentity,mapDirty=true;
const featMeta=new WeakMap();
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(t=>{world110=topojson.feature(t,t.objects.countries);mapDirty=true}).catch(()=>{});
function load50(){if(world50||loading50)return;loading50=true;fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r=>r.json()).then(t=>{world50=topojson.feature(t,t.objects.countries);mapDirty=true}).catch(()=>{})}
const zoom=d3.zoom().scaleExtent([1,60]).on('zoom',e=>{ZT=e.transform;mapDirty=true;$('zl').textContent='×'+ZT.k.toFixed(1);if(ZT.k>=3)load50()});
d3.select(cv).call(zoom);
function resize(){
  const r=cv.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=r.width;H=r.height;if(W<50||H<50)return;
  if(!S.lanUser)S.showLan=W>=390&&H>=330;  /* LAN κουτί 330×270 */  // το LAN κουτί δεν χωράει σε μικρό χάρτη (το ▣ το ξαναφέρνει)
  cv.width=W*DPR;cv.height=H*DPR;proj=d3.geoNaturalEarth1().fitExtent([[20,20],[W-20,H-20]],{type:'Sphere'});
  zoom.extent([[0,0],[W,H]]).translateExtent([[-W*.1,-H*.1],[W*1.1,H*1.1]]);
  mapImg=document.createElement('canvas');mapImg.width=W*DPR;mapImg.height=H*DPR;mapDirty=true;
}
new ResizeObserver(()=>resize()).observe(cv);resize();
function renderMap(){
  const m=mapImg.getContext('2d'),k=ZT.k;m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,mapImg.width,mapImg.height);
  m.setTransform(DPR*k,0,0,DPR*k,DPR*ZT.x,DPR*ZT.y);const p=d3.geoPath(proj,m);
  m.beginPath();p({type:'Sphere'});m.fillStyle='#070d18';m.fill();m.lineWidth=1/k;m.strokeStyle='#14223a';m.stroke();
  m.beginPath();p(d3.geoGraticule10());m.strokeStyle='#0e1828';m.lineWidth=.5/k;m.stroke();
  const w=(k>=3&&world50)||world110;if(!w)return;
  m.beginPath();p(w);m.fillStyle='#0f1b2e';m.fill();m.strokeStyle='#1f3352';m.lineWidth=.7/k;m.stroke();
  if(k<1.8)return;
  m.setTransform(DPR,0,0,DPR,0,0);m.font='10px ui-monospace,monospace';m.fillStyle='#4a6185';m.textAlign='center';
  for(const f of w.features){let md=featMeta.get(f);if(!md){md={c:d3.geoCentroid(f),a:d3.geoArea(f)};featMeta.set(f,md)}
    if(md.a<0.03/(k*k))continue;const b=proj(md.c);if(!b)continue;const s=ZT.apply(b);if(s[0]<0||s[1]<0||s[0]>W||s[1]>H)continue;
    m.fillText(f.properties.name||'',s[0],s[1])}
  m.textAlign='start';
}
function P(lon,lat){const p=proj([lon,lat]);return p?ZT.apply(p):null}
$('zin').onclick=()=>d3.select(cv).transition().duration(400).call(zoom.scaleBy,2);
$('zout').onclick=()=>d3.select(cv).transition().duration(400).call(zoom.scaleBy,.5);
$('zreset').onclick=()=>d3.select(cv).transition().duration(600).call(zoom.transform,d3.zoomIdentity);
$('zlan').onclick=()=>{S.showLan=!S.showLan;S.lanUser=true};

  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.min(maxK||8,.7/Math.max((x1-x0)/W,(y1-y0)/H,1/(maxK||8)));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  d3.select(cv).transition().duration(900).call(zoom.transform,t)}

function focusHost(ip){const h=S.hosts.get(ip);if(h?.geo)zoomTo([[h.geo.lon,h.geo.lat]],12)}

const LAN={w:330,h:270,max:12};
function lanBox(){return{x:16,y:H-LAN.h-16,w:LAN.w,h:LAN.h}}
function homePt(){const g=S.home||{lat:37.98,lon:23.73};return P(g.lon,g.lat)}
const isV6=ip=>ip.includes(':'),octet=ip=>isV6(ip)?'IPv6':'.'+ip.split('.').pop();
// Μία κουκκίδα ανά ΣΥΣΚΕΥΗ: οι IPv6 διευθύνσεις (fe80::…) «κολλάνε» στη συσκευή με την ίδια MAC,
// όλα τα broadcast/multicast γίνονται ένας κόμβος «όλοι», οι συσκευές μπαίνουν σε σταθερό κύκλο.
let LP={alias:new Map(),pos:new Map(),devs:[],more:0,v6:new Map()};
function lanPlan(){
  const b=lanBox(),cx=b.x+b.w/2,cy=b.y+b.h/2+2,me=[...S.me].find(i=>!isV6(i))||[...S.me][0];
  const v4=new Map();for(const h of S.hosts.values())if(h.kind==='local'&&!isV6(h.ip)&&h.mac&&!v4.has(h.mac))v4.set(h.mac,h.ip);
  const gwMac=S.hosts.get(S.gw)?.mac,alias=new Map(),v6=new Map(),devs=[];
  for(const h of S.hosts.values()){
    if(h.kind==='bcast'){alias.set(h.ip,'@bcast');continue}
    if(h.kind!=='local')continue;
    let a=h.ip;
    if(h.me)a=me;else if(h.gw)a=S.gw;else if(isV6(h.ip)&&h.mac)a=v4.get(h.mac)||(h.mac===gwMac?S.gw:h.ip);
    alias.set(h.ip,a);
    if(a!==h.ip){if(!v6.has(a))v6.set(a,[]);v6.get(a).push(h.ip)}
    else if(!h.me&&!h.gw)devs.push(h)}
  devs.sort((x,y)=>(y.threat-x.threat)||((y.bytes_in+y.bytes_out)-(x.bytes_in+x.bytes_out)));
  const shown=devs.slice(0,LAN.max).sort((x,y)=>ipNum(x.ip)-ipNum(y.ip)),n=shown.length,pos=new Map();
  shown.forEach((h,i)=>{const ang=-Math.PI/2+(i+.5)*2*Math.PI/n;pos.set(h.ip,[cx+Math.cos(ang)*92,cy+Math.sin(ang)*76,Math.cos(ang)])});
  LP={alias,pos,devs:shown,more:devs.length-n,v6,me,cx,cy,b}}
function ipNum(ip){return isV6(ip)?1e10:ip.split('.').reduce((a,x)=>a*256+(+x),0)}
function lanPt(ip){if(!LP.b)lanPlan();const b=LP.b;
  if(ip==='@bcast')return[b.x+b.w-22,b.y+b.h-44];
  const h=S.hosts.get(ip);if(!h)return null;
  if(h.me)return[LP.cx,LP.cy];if(h.gw)return[LP.cx,b.y+40];
  const p=LP.pos.get(ip);return p?[p[0],p[1]]:[b.x+b.w-22,b.y+b.h-44]}
function pos(ip){
  const h=S.hosts.get(ip);if(!h)return null;
  if(h.kind==='public'){if(!h.geo)return null;const p=P(h.geo.lon,h.geo.lat);if(!p)return null;const k=hash(ip),s=.9*Math.sqrt(ZT.k);
    return[p[0]+((k&15)-7.5)*s,p[1]+(((k>>4)&15)-7.5)*s]}
  if(!S.showLan)return homePt();
  return lanPt(LP.alias.get(ip)||ip);
}
function ends(sip,dip){const hs=S.hosts.get(sip),hd=S.hosts.get(dip);if(!hs||!hd)return[null,null];
  if(hs.kind==='public'&&hd.kind!=='public')return[pos(sip),homePt()];
  if(hd.kind==='public'&&hs.kind!=='public')return[homePt(),pos(dip)];
  return[pos(sip),pos(dip)]}
function colorFor(it){if(it.x)return'#ff3b5c';return COLORS[it.a]||COLORS[it.p]||'#8aa0bd'}

let parts=[];const ripples=[];
function spawn(it,delay){
  if(!proj)return;const hs=S.hosts.get(it.s),hd=S.hosts.get(it.d);if(!hs||!hd)return;
  const key=it.s<it.d?it.s+'|'+it.d:it.d+'|'+it.s;
  let L=S.links.get(key);if(!L){L={a:it.s,b:it.d,bytes:0,pk:0};S.links.set(key,L)}
  L.last=performance.now();L.bytes+=it.l;L.pk++;L.color=colorFor(it);L.bad=L.bad||it.x;
  if(parts.length>900)return;
  parts.push({s:it.s,d:it.d,t0:performance.now()+(delay||0),c:colorFor(it),r:it.x?2.6:1.2+Math.min(1.8,it.l/900),x:it.x});
}
function ctrl(a,b,d){return[(a[0]+b[0])/2,(a[1]+b[1])/2-Math.min(160,d*.28)]}
function bez(a,c,b,t){const u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]]}

let nodesDrawn=[];
function frame(){requestAnimationFrame(frame);
  if(W<50||H<50||!mapImg||!mapImg.width){if(cv.getBoundingClientRect().width>50)resize();return}
  try{if(mapDirty){mapDirty=false;renderMap()}draw()}catch(e){console.error(e)}}
function draw(){
  const now=performance.now();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05080f';ctx.fillRect(0,0,W,H);ctx.drawImage(mapImg,0,0,W,H);
  const hp=homePt(),b=lanBox(),sel=S.sel;
  if(S.showLan){lanPlan();ctx.fillStyle='#08101de8';ctx.strokeStyle='#1f3352';ctx.lineWidth=1;roundRect(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.stroke();
    ctx.fillStyle='#8aa0bd';ctx.font='bold 10px ui-monospace,monospace';ctx.fillText('🏠 ΤΟ ΔΙΚΤΥΟ ΣΟΥ',b.x+10,b.y+16);
    ctx.font='10px ui-monospace,monospace';ctx.fillStyle='#6d7f99';const nd=LP.devs.length+LP.more;
    ctx.fillText(`${nd} συσκευ${nd===1?'ή':'ές'} + εσύ + router`,b.x+10,b.y+29);
    let lx=b.x+10;const ly=b.y+b.h-10;ctx.font='9px ui-monospace,monospace';
    for(const[c,t]of[['#fff','εσύ'],['#3ec5ff','router'],['#3ddc97','συσκευή'],['#ffd23f','νέα'],['#ff3b5c','επίθεση']]){
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(lx+3,ly-3,3,0,7);ctx.fill();ctx.fillStyle='#8aa0bd';ctx.fillText(t,lx+9,ly);lx+=ctx.measureText(t).width+20}
    ctx.fillStyle='#6d7f99';ctx.textAlign='right';ctx.fillText('γραμμές = κίνηση',b.x+b.w-10,b.y+16);ctx.textAlign='start';
    const gwp=S.gw&&S.hosts.has(S.gw)?pos(S.gw):[b.x+b.w/2,b.y+34];
    ctx.setLineDash([3,4]);ctx.strokeStyle='#3ec5ff44';ctx.beginPath();ctx.moveTo(gwp[0],gwp[1]);ctx.lineTo(hp[0],hp[1]);ctx.stroke();ctx.setLineDash([])}
  for(const[k,L]of S.links){const age=(now-L.last)/1000;if(age>25){S.links.delete(k);continue}
    const[a,c]=ends(L.a,L.b);if(!a||!c)continue;const d=Math.hypot(c[0]-a[0],c[1]-a[1]),q=ctrl(a,c,d);
    let al=Math.max(0,.45*(1-age/25));if(sel)al*=(L.a===sel||L.b===sel)?2:.2;
    ctx.globalAlpha=Math.min(1,al);ctx.strokeStyle=L.bad?'#ff3b5c':L.color;ctx.lineWidth=L.bad?1.6:Math.min(2.5,.5+Math.log10(L.bytes+1)/3);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.quadraticCurveTo(q[0],q[1],c[0],c[1]);ctx.stroke()}
  ctx.globalAlpha=1;nodesDrawn=[];const top=[];
  for(const h of S.hosts.values()){
    if(h.kind!=='public')continue;
    const p=pos(h.ip);if(!p||p[0]<-20||p[1]<-20||p[0]>W+20||p[1]>H+20)continue;const tot=h.bytes_in+h.bytes_out;
    const r=h.me?7:h.gw?6:Math.min(7,1.5+Math.log10(tot+10)*.6);
    const col=h.threat>=2?'#ff3b5c':h.threat===1?'#ffd23f':h.me?'#ffffff':h.gw?'#ffd23f':h.kind==='public'?'#3ec5ff':h.kind==='bcast'?'#6d7f99':'#3ddc97';
    if(h.threat>=2){const ph=(now/900+hash(h.ip)%10/10)%1;ctx.strokeStyle=`rgba(255,59,92,${1-ph})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],r+ph*22,0,7);ctx.stroke()}
    const fl=h._flash?Math.max(0,1-(now-h._flash)/400):0;
    ctx.fillStyle=col;ctx.globalAlpha=(sel&&sel!==h.ip?.08:.16)+fl*.4;ctx.beginPath();ctx.arc(p[0],p[1],r*1.7+fl*4,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(p[0],p[1],r*.65,0,7);ctx.fill();
    if(sel===h.ip){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p[0],p[1],r+6+Math.sin(now/200)*2,0,7);ctx.stroke()}
    nodesDrawn.push({ip:h.ip,x:p[0],y:p[1],r:Math.max(r,6)});
    top.push([tot+(h.threat?1e12:0)+(sel===h.ip?1e13:0),h,p]);
  }
  if(S.showLan)drawLan(now,sel);
  top.sort((x,y)=>y[0]-x[0]);ctx.font='11px ui-monospace,monospace';
  const nl=Math.round(9*Math.min(4,Math.sqrt(ZT.k)));
  for(const[,h,p]of top.slice(0,nl)){const t=`${flag(h.geo?.countryCode)} ${hname(h)||h.ip}${ZT.k>3&&h.geo?.city?' · '+h.geo.city:''}`.slice(0,44);
    ctx.fillStyle='#000a';const w=ctx.measureText(t).width;ctx.fillRect(p[0]+9,p[1]-8,w+6,15);ctx.fillStyle=h.threat>=2?'#ff8da0':'#cfe0f5';ctx.fillText(t,p[0]+12,p[1]+3)}
  const ph=(now/1400)%1;ctx.strokeStyle=`rgba(255,255,255,${.8-ph*.8})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(hp[0],hp[1],5+ph*18,0,7);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hp[0],hp[1],4,0,7);ctx.fill();ctx.font='bold 11px ui-monospace,monospace';ctx.fillText('⌂ '+(S.home?.city||'ΕΔΩ'),hp[0]+8,hp[1]-8);
  ctx.globalCompositeOperation='lighter';const keep=[];
  for(const p of parts){const[a,b2]=ends(p.s,p.d);if(!a||!b2)continue;
    const d=Math.hypot(b2[0]-a[0],b2[1]-a[1]),dur=Math.min(2200,500+d*2.2/Math.max(1,Math.sqrt(ZT.k)));
    const t=(now-p.t0)/dur;if(t<0){keep.push(p);continue}
    if(t>=1){const h=S.hosts.get(p.d);if(h)h._flash=now;if(p.x)ripples.push({ip:p.d,t0:now});continue}
    keep.push(p);const q=ctrl(a,b2,d);let dim=sel&&p.s!==sel&&p.d!==sel?.25:1;
    for(let i=4;i>=1;i--){const pt=bez(a,q,b2,Math.max(0,t-i*.025));ctx.globalAlpha=.12*(5-i)*dim;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(pt[0],pt[1],p.r*.8,0,7);ctx.fill()}
    const pt=bez(a,q,b2,t);ctx.globalAlpha=.25*dim;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(pt[0],pt[1],p.r*3,0,7);ctx.fill();
    ctx.globalAlpha=dim;ctx.beginPath();ctx.arc(pt[0],pt[1],p.r,0,7);ctx.fill()}

  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i],t=(now-r.t0)/700;const p=pos(r.ip)||homePt();if(t>1||!p){ripples.splice(i,1);continue}
    ctx.globalAlpha=1-t;ctx.strokeStyle='#ff3b5c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],4+t*26,0,7);ctx.stroke()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function lanName(h){const n=hname(h).split('.')[0];if(n)return n.length>12?n.slice(0,11)+'…':n;return randMac(h.mac)?'📱 κινητό;':'συσκευή'}
function drawLan(now,sel){
  const list=[];const meH=S.hosts.get(LP.me),gwH=S.hosts.get(S.gw);
  const bc=[...S.hosts.values()].filter(h=>h.kind==='bcast');
  if(bc.length)list.push({ip:'@bcast',p:lanPt('@bcast'),col:'#6d7f99',r:4,l1:'📢 όλοι',l2:'broadcast',side:-1});
  if(gwH)list.push({ip:gwH.ip,h:gwH,p:lanPt(gwH.ip),col:'#3ec5ff',r:6.5,l1:'ROUTER',l2:octet(gwH.ip),side:1});
  for(const h of LP.devs){const q=LP.pos.get(h.ip);list.push({ip:h.ip,h,p:[q[0],q[1]],col:'#3ddc97',r:4.5,l1:lanName(h),l2:octet(h.ip),side:q[2]>=-.05?1:-1})}
  if(meH)list.push({ip:meH.ip,h:meH,p:[LP.cx,LP.cy],col:'#fff',r:7,l1:'ΕΣΥ',l2:octet(meH.ip),side:1,me:1});
  for(const n of list){const h=n.h,[x,y]=n.p;let col=n.col;
    if(h&&h.threat>=2)col='#ff3b5c';else if(h&&h.threat===1)col='#ffd23f';
    if(h&&h.threat>=2){const ph=(now/900)%1;ctx.strokeStyle=`rgba(255,59,92,${1-ph})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,n.r+ph*18,0,7);ctx.stroke()}
    const fl=h&&h._flash?Math.max(0,1-(now-h._flash)/400):0;
    ctx.fillStyle=col;ctx.globalAlpha=(sel&&sel!==n.ip?.1:.2)+fl*.4;ctx.beginPath();ctx.arc(x,y,n.r*1.8+fl*4,0,7);ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(x,y,n.r*.75,0,7);ctx.fill();
    if(n.me){ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,n.r+3,0,7);ctx.stroke()}
    if(sel===n.ip){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,n.r+7+Math.sin(now/200)*2,0,7);ctx.stroke()}
    const tx=x+n.side*(n.r+6);ctx.textAlign=n.side>0?'left':'right';
    ctx.font=(n.me?'bold ':'')+'10px ui-monospace,monospace';ctx.fillStyle=n.me?'#fff':h&&h.threat>=2?'#ff8da0':'#cfe0f5';ctx.fillText(n.l1,tx,y);
    ctx.font='9px ui-monospace,monospace';ctx.fillStyle='#6d7f99';ctx.fillText(n.l2,tx,y+10);ctx.textAlign='start';
    nodesDrawn.push({ip:n.ip,x,y,r:Math.max(n.r,7)})}
  if(LP.more>0){const b=LP.b;ctx.font='9px ui-monospace,monospace';ctx.fillStyle='#8aa0bd';ctx.textAlign='right';
    ctx.fillText(`+${LP.more} ακόμα (📟 Συσκευές)`,b.x+b.w-10,b.y+31);ctx.textAlign='start'}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function pick(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=1e9;
  for(const n of nodesDrawn){const d=Math.hypot(n.x-x,n.y-y);if(d<n.r+5&&d<bd){bd=d;best=n}}return[best,x,y]}

  placeTip(tip,x,y)});

const VLOOK={ok:['#3ddc97','🟢 Συνήθως αθώο'],check:['#ffd23f','🟡 Αξίζει να το ελέγξεις'],bad:['#ff3b5c','🔴 Πιθανό πρόβλημα']};
function roleTag(ip){const h=S.hosts.get(ip);if(!h)return'';return h.me?' <span class="tag">εσύ</span>':h.gw?' <span class="tag">router</span>':h.kind==='local'?' <span class="tag">συσκευή σου</span>':h.kind==='public'?' <span class="tag">Internet</span>':''}
function alertHTML(a){const h=S.hosts.get(a.actor),g=h?.geo,open=S.openEdu.has(a.id),e=eduFor(a.type),v=verdictFor(a.type);

  const out=a.type.startsWith('Ύποπτη εξερχόμενη')||a.type.startsWith('Σύνδεση σε κακόβουλη');  // εσύ ξεκίνησες τη σύνδεση

  <div style="margin:4px 0">${out?'':flag(g?.countryCode)+' '}<b>${esc(from)}</b>${roleTag(from)} → ${out?flag(g?.countryCode)+' ':''}${esc(to)}${roleTag(to)} ${g?`<span style="color:#6d7f99">· ${esc(g.country)} · ${esc(g.isp)}</span>`:''}</div>

  ${a.mitre?`<div style="margin-top:4px"><a class="mitre" target="_blank" href="${esc(a.mitre.url)}" title="${esc(a.mitre.name)}">MITRE ATT&amp;CK ${esc(a.mitre.id)}</a> <span class="sm">${esc(a.mitre.tactic)} · ${esc(a.mitre.name)}</span></div>`:''}
  <div class="act"><button class="b" data-sel="${esc(a.actor)}">🔎 ${a.sev==='high'&&!a.benign?'Ανάλυση επιτιθέμενου':'Ποιος είναι;'}</button><button class="b" data-edu="${a.id}">${open?'▾':'ℹ'} Πες μου περισσότερα</button>${g?`<button class="b" data-map="${esc(a.actor)}">📍 Χάρτης</button>`:''}${!a.benign&&a.sev!=='low'&&canBlock(a.actor)?`<button class="b" data-block="${esc(a.actor)}" data-why="${esc(a.type)}" style="border-color:#ff3b5c55">${blockedSet.has(a.actor)?'✅ Μπλοκαρισμένο':'🚫 Μπλόκαρε'}</button>`:''}</div>

function bindCommon(el){
  el.querySelectorAll('[data-sel]').forEach(d=>d.onclick=e=>{e.stopPropagation();select(d.dataset.sel)});
  el.querySelectorAll('[data-map]').forEach(d=>d.onclick=e=>{e.stopPropagation();S.sel=d.dataset.map;focusHost(d.dataset.map)});
  el.querySelectorAll('[data-edu]').forEach(d=>d.onclick=e=>{e.stopPropagation();const id=+d.dataset.edu;S.openEdu.has(id)?S.openEdu.delete(id):S.openEdu.add(id);renderTab()});
  el.querySelectorAll('[data-block]').forEach(d=>d.onclick=e=>{e.stopPropagation();blockIp(d.dataset.block,d.dataset.why)});
}
// ---- 🚫 Μπλοκ: κόψε μια IP με το τείχος του υπολογιστή (pf στο Mac) ----
let blockData=null,blockedSet=new Set();
const canBlock=ip=>/^[0-9a-f.:]+$/i.test(ip||'')&&!S.me.has(ip)&&ip!==S.gw&&!/^(127\.|0\.|22[4-9]\.|23\d\.|255\.)/.test(ip);
function loadBlock(){return fetch('/api/block').then(r=>r.json()).then(j=>{blockData=j;blockedSet=new Set((j.blocked||[]).map(x=>x.ip));return j})}
function blockIp(ip,why){
  if(blockedSet.has(ip)){showTab('block');return}
  const live=blockData&&blockData.can_apply&&!blockData.demo;
  if(!confirm(`Να μπλοκάρω το ${ip};\n\nΟ υπολογιστής σου δεν θα στέλνει ούτε θα δέχεται τίποτα από αυτή τη διεύθυνση.\n${live?'Θα μπει κανόνας στο τείχος προστασίας (pf). Τον βγάζεις από την καρτέλα 🚫 Μπλοκ, και φεύγει μόνος του όταν κλείσεις το NetWatch.':blockData&&blockData.demo?'(Προσομοίωση: δεν αγγίζω το πραγματικό τείχος.)':'Δεν τρέχω ως διαχειριστής: θα σου δείξω τις εντολές να τις τρέξεις εσύ.'}`))return;
  post('/api/block',{ip,why}).then(j=>{if(j.error&&!j.blocked)return alert(j.error);blockData=j;blockedSet=new Set(j.blocked.map(x=>x.ip));showTab('block')})}
function renderBlock(){if(!blockData){$('t-block').innerHTML='<div class="empty">φόρτωση…</div>';loadBlock().then(()=>tab==='block'&&drawBlock());return}if(!tabHover())drawBlock()}
function drawBlock(){const d=blockData,el=$('t-block');if(d.error&&!d.blocked){el.innerHTML=`<div class="empty">${esc(d.error)}</div>`;return}
  const mode=d.demo?'<span class="tag">προσομοίωση</span>':d.can_apply?'<span class="tag g">ενεργό τείχος (pf)</span>':'<span class="tag y">χωρίς δικαιώματα: δείχνω εντολές</span>';
  let h=`<div class="card" style="white-space:normal"><b style="color:#fff">🚫 Μπλοκαρισμένες διευθύνσεις (${d.blocked.length})</b> ${mode}
    <div class="sm" style="margin-top:3px">Πάτα «🚫 Μπλόκαρε» σε μια ειδοποίηση ή γράψε IP εδώ. Ο κανόνας κόβει την κίνηση <b>και προς τις δύο κατευθύνσεις</b>. Δεν μπλοκάρω ποτέ εσένα ή τον router. Οι κανόνες φεύγουν όταν κλείσεις το NetWatch ή κάνεις επανεκκίνηση.</div>
    <div style="display:flex;gap:6px;margin-top:6px"><input id="bl-ip" placeholder="π.χ. 45.33.32.156" style="flex:1;background:#060a12;border:1px solid #1f3352;border-radius:4px;color:#fff;padding:3px 6px"><button class="b" id="bl-go">🚫 Μπλόκαρε</button></div>
    ${d.error?`<div style="color:#ff8da0;margin-top:4px">${esc(d.error)}</div>`:''}</div>`;
  h+=d.blocked.length?`<table><thead><tr><th>IP</th><th>γιατί</th><th>από</th><th></th></tr></thead><tbody>${d.blocked.map(x=>`<tr><td><a href="#" data-ip="${esc(x.ip)}">${esc(x.ip)}</a></td><td class="sm">${esc(x.why||'—')}</td><td class="sm">${new Date(x.t*1000).toLocaleTimeString('el-GR')}</td><td><button class="b" data-un="${esc(x.ip)}">↩ Ξεμπλόκαρε</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Τίποτα μπλοκαρισμένο.</div>';
  h+=`<h3>${d.platform==='darwin'?'Κανόνες pf (anchor com.apple/netwatch)':'Εντολές τείχους'}</h3><pre class="card" style="font-family:monospace;font-size:11.5px;overflow:auto">${esc(d.rules)}</pre>`;
  if(!d.can_apply&&d.blocked.length)h+=`<div class="card" style="white-space:normal">👉 Τρέξε στο Terminal (θα ζητήσει κωδικό διαχειριστή):<pre style="font-family:monospace;font-size:11.5px;overflow:auto">${esc(d.commands.join('\n'))}</pre></div>`;
  h+=`<div class="card sm" style="white-space:normal">💡 <b>Πότε αξίζει;</b> Όταν μια IP του Internet σε σκανάρει ή δοκιμάζει κωδικούς επίμονα. Για συσκευή <b>μέσα</b> στο δίκτυό σου, το μπλοκ προστατεύει μόνο αυτόν τον υπολογιστή· βγάλ' την από το Wi‑Fi (άλλαξε κωδικό) για να προστατέψεις όλους.</div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>post('/api/block',{unblock:b.dataset.un}).then(j=>{blockData=j;blockedSet=new Set(j.blocked.map(x=>x.ip));drawBlock()}));
  el.querySelectorAll('[data-ip]').forEach(x=>x.onclick=e=>{e.preventDefault();select(x.dataset.ip)});
  $('bl-go').onclick=()=>{const v=$('bl-ip').value.trim();if(v)blockIp(v,'χειροκίνητα')}}
function renderAlerts(){const el=$('t-alerts');if(!S.alerts.length)return;
  const counts={};S.alerts.forEach(a=>counts[a.sev]=(counts[a.sev]||0)+1);
  el.innerHTML=`<div style="margin-bottom:8px"><button class="b" onclick="exportReport()">⬇ Αναφορά συμβάντος (JSON)</button></div><div class="sm" style="margin-bottom:8px">${counts.high||0} σοβαρές · ${counts.med||0} μέτριες · ${counts.low||0} χαμηλές — πάτα «Πες μου περισσότερα» για αναλυτική εξήγηση</div>`+S.alerts.slice(0,200).map(alertHTML).join('');bindCommon(el)}

let sortK='bytes',sortD=-1;
document.querySelectorAll('#t-hosts th').forEach(th=>th.onclick=()=>{const k=th.dataset.s;sortD=sortK===k?-sortD:(k==='bytes'?-1:1);sortK=k;renderHosts()});
$('hf').oninput=()=>renderHosts();
function renderHosts(){
  const f=$('hf').value.toLowerCase();
  let rows=[...S.hosts.values()].filter(h=>h.kind==='public').map(h=>({h,ip:h.ip,name:hname(h),cc:h.geo?.countryCode||'',bytes:h.bytes_in+h.bytes_out}));
  if(f)rows=rows.filter(r=>(r.ip+' '+r.name+' '+(r.h.geo?`${r.h.geo.country} ${r.h.geo.city} ${r.h.geo.isp} ${r.h.geo.as}`:'')+' '+(r.h.names||[]).join(' ')).toLowerCase().includes(f));
  rows.sort((a,b)=>(a[sortK]>b[sortK]?1:a[sortK]<b[sortK]?-1:0)*sortD);
  $('hb').innerHTML=rows.slice(0,300).map(r=>`<tr class="r ${r.h.threat>=2?'bad':''}" data-ip="${esc(r.ip)}"><td>${esc(r.ip)}</td><td title="${esc(r.name)}">${esc(r.name)}</td><td>${flag(r.cc)} ${esc(r.cc)}</td><td>${fmtB(r.bytes)}</td></tr>`).join('');
  $('hb').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>select(tr.dataset.ip));
}

function renderDevs(){
  const el=$('t-devs');const devs=[...S.hosts.values()].filter(h=>h.kind==='local').sort((a,b)=>(b.me-a.me)||(b.gw-a.gw)||((b.bytes_in+b.bytes_out)-(a.bytes_in+a.bytes_out)));
  el.innerHTML=`<div class="sm" style="margin-bottom:8px">Οι συσκευές που φάνηκαν στο τοπικό σου δίκτυο (${devs.length}). Αν δεν αναγνωρίζεις κάποια, έλεγξε τον κατασκευαστή από τη MAC.</div>`+
  devs.map(h=>{const tags=[];if(h.me)tags.push('<span class="tag g">ΕΣΥ</span>');if(h.gw)tags.push('<span class="tag y">ROUTER</span>');
    if(h.threat>=2)tags.push('<span class="tag r">⚠ ΥΠΟΠΤΗ</span>');if(randMac(h.mac))tags.push('<span class="tag">τυχαία MAC (κινητό;)</span>');
    if(h.ip.includes(':'))tags.push('<span class="tag">IPv6</span>');
    const pr=Object.keys(h.protos||{}).slice(0,5).join(', ');
    return `<div class="card click" data-sel="${esc(h.ip)}"><div style="display:flex;justify-content:space-between"><b style="color:#fff">${esc(hname(h)||h.ip)}</b><span class="sm">από ${fmtT(h.first)}</span></div>
     <div>${esc(h.ip)} ${h.mac?'· '+esc(h.mac):''}</div><div>${tags.join('')}</div>
     <div class="sm">↑ ${fmtB(h.bytes_out)} ↓ ${fmtB(h.bytes_in)} · ${esc(pr)}</div></div>`}).join('');
  bindCommon(el)}

function barList(entries,colorFn,fmt){const mx=Math.max(1,...entries.map(e=>e[1]));
  return entries.map(([k,v,extra])=>`<div class="brow"><span>${k}</span><span>${fmt?fmt(v):v}</span></div><div class="bar"><i style="width:${v/mx*100}%;background:${colorFn?colorFn(k,extra):'#3ec5ff'}"></i></div>`).join('')}
function renderStats(){
  const el=$('t-stats'),st=S.stats,hosts=[...S.hosts.values()],pub=hosts.filter(h=>h.kind==='public');
  const countries={},orgs={};for(const h of pub){const g=h.geo;if(!g)continue;const b=h.bytes_in+h.bytes_out;
    const ck=flag(g.countryCode)+' '+g.country;countries[ck]=(countries[ck]||0)+b;const ok=g.org||g.isp||g.as;orgs[ok]=(orgs[ok]||0)+b}
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const types={};S.alerts.forEach(a=>types[a.type]=(types[a.type]||0)+1);
  const atk=hosts.filter(h=>h.threat>=2);
  const tot=Object.values(st.protos||{}).reduce((a,b)=>a+b,0)||1;
  const talkers=hosts.filter(h=>h.kind==='local').sort((a,b)=>(b.bytes_in+b.bytes_out)-(a.bytes_in+a.bytes_out)).slice(0,6);
  el.innerHTML=`<div class="grid2">
   <div class="card"><div class="sm">σύνολο πακέτων</div><div class="big">${(st.pkts||0).toLocaleString('el-GR')}</div></div>
   <div class="card"><div class="sm">σύνολο δεδομένων</div><div class="big">${fmtB(st.bytes||0)}</div></div>
   <div class="card"><div class="sm">χώρες που επικοινωνείς</div><div class="big">${Object.keys(countries).length}</div></div>
   <div class="card"><div class="sm">επιτιθέμενοι</div><div class="big" style="color:${atk.length?'var(--red)':'var(--green)'}">${atk.length}</div></div></div>
   <div class="sm">σε λειτουργία ${fmtDur(st.uptime||0)}</div>
   <h3>Κίνηση (τελευταία 5 λεπτά)</h3><canvas class="ch" id="chT"></canvas><div class="sm"><span style="color:#3ec5ff">━ πακέτα/s</span> &nbsp; <span style="color:#b388ff">━ KB/s</span></div>
   <h3>Πρωτόκολλα</h3>${barList(Object.entries(st.protos||{}).slice(0,8).map(([k,v])=>[esc(k)+` <span class="sm">${esc((PROTO_INFO[k]||'').slice(0,50))}${PROTO_INFO[k]?'…':''}</span>`,v,k]),(k,x)=>COLORS[x]||'#8aa0bd',v=>(v/tot*100).toFixed(1)+'%')}
   <h3>Χώρες (κατά όγκο)</h3>${barList(top(countries).map(([k,v])=>[esc(k),v]),()=>'#3ec5ff',fmtB)||'<div class="sm">—</div>'}
   <h3>Εταιρείες / πάροχοι</h3>${barList(top(orgs).map(([k,v])=>[esc(k),v]),()=>'#b388ff',fmtB)||'<div class="sm">—</div>'}
   <h3>Ποια συσκευή καταναλώνει</h3>${barList(talkers.map(h=>[esc(h.me?'Εσύ':h.gw?'Router':hname(h)||h.ip),h.bytes_in+h.bytes_out]),()=>'#3ddc97',fmtB)}
   ${systemHTML()}
   <h3>MITRE ATT&amp;CK — τακτικές που είδα</h3><div class="sm" style="margin-bottom:6px">Το παγκόσμιο «λεξικό» τεχνικών επίθεσης που χρησιμοποιούν τα SOC.</div>${mitreGrid()}
   <h3>Επιθέσεις ανά τύπο</h3>${barList(Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[esc(k),v]),()=>'#ff3b5c')||'<div class="sm">Καμία ακόμα 🎉</div>'}
   ${atk.length?'<h3>Επιτιθέμενοι</h3>'+atk.map(h=>`<div class="card click" data-sel="${esc(h.ip)}">${flag(h.geo?.countryCode)} <b>${esc(h.ip)}</b> <span class="sm">${esc(h.geo?.country||'LAN')} · ${esc(h.geo?.isp||h.mac||'')}</span><br><span class="sm">${(h.hits||[]).slice(0,5).map(x=>x[0]+(x[2]?' '+x[2]:'')).join(', ')}</span></div>`).join(''):''}`;
  bindCommon(el);drawChart($('chT'),[S.hist.map(x=>x.pps),S.hist.map(x=>x.bps/1024)],['#3ec5ff','#b388ff']);

function systemHTML(){const f=S.features;if(!f)return'';const it=f.intel||{};
  const det=Object.entries(f.detectors||{}),on=det.filter(d=>d[1]).length;

function explainPacket(p){
  const A=who(p.s),B=who(p.d),out=[];if(p.x)out.push('⚠ <b style="color:#ff8da0">Πακέτο από επιτιθέμενο.</b>');
  const pi=portInfo(p.dp)||portInfo(p.sp);
  if(p.p==='ARP')out.push(p.f==='who-has'?`${esc(A)} φωνάζει σε όλο το LAN: «Ποιος έχει την IP ${esc(p.d)};»`:`${esc(A)} απαντά: «Εγώ έχω την IP ${esc(p.s)} — να η MAC μου». ${S.alerts.some(a=>a.type.startsWith('ARP spoofing')&&a.target===p.s)?'<b style="color:#ff8da0">Προσοχή: για αυτή την IP έχει εντοπιστεί ARP spoofing!</b>':''}`);
  else if(p.a==='DNS')out.push(p.dp===53?`${esc(A)} ρωτάει τον DNS server ${esc(B)} για τη διεύθυνση ενός site.`:`Ο DNS server ${esc(A)} απαντά στον ${esc(B)} με τη διεύθυνση IP που ζητήθηκε.`);
  else if(p.p==='ICMP')out.push(`${esc(A)} στέλνει ping/ICMP στον ${esc(B)} («είσαι εκεί;»).`);
  else if(p.p==='TCP'){const svc=pi?pi[0]:'θύρα '+p.dp;out.push(`${esc(A)} → ${esc(B)}: ${esc(FLAGS[p.f]||'σημαίες '+p.f)}.`);
    if(p.f==='S'&&pi)out.push(`Στόχος: <b>${esc(svc)}</b> — ${esc(pi[1])}.`)}
  else if(p.a==='QUIC')out.push(`${esc(A)} → ${esc(B)}: κρυπτογραφημένη κίνηση QUIC (HTTP/3) — π.χ. YouTube/Google.`);
  else if(p.p==='UDP')out.push(`${esc(A)} → ${esc(B)}: πακέτο UDP ${pi?'('+esc(pi[0])+': '+esc(pi[1])+')':''}.`);
  else out.push(`${esc(A)} → ${esc(B)}`);
  if(PROTO_INFO[p.a])out.push(`<span class="sm">${esc(p.a)}: ${esc(PROTO_INFO[p.a])}</span>`);
  out.push(`<span class="sm">Μέγεθος ${p.l} bytes · θύρες ${p.sp??'-'} → ${p.dp??'-'}</span>`);
  return out.join('<br>')+layersHTML(p)}

function ipClass(ip){if(S.me.has(ip))return'εσύ';if(ip===S.gw)return'router';

  if(p.p!=='ARP'&&p.p!=='ICMP')L.push(['7','Εφαρμογή',p.a,PROTO_INFO[p.a]||(pi?pi[0]+': '+pi[1]:'Τα δεδομένα του προγράμματος (συχνά κρυπτογραφημένα).'),'#b388ff']);

function setStats(s){S.stats=s;$('pps').textContent=s.pps;$('bps').textContent=fmtB(s.bps)+'/s';$('nh').textContent=s.hosts;

  c.clearRect(0,0,160,34);c.beginPath();S.spark.forEach((v,i)=>c[i?'lineTo':'moveTo'](i*3,32-v/mx*30));c.strokeStyle='#3ec5ff';c.lineWidth=1.5;c.stroke();
  c.lineTo((S.spark.length-1)*3,34);c.lineTo(0,34);c.fillStyle='#3ec5ff22';c.fill();updStatus()}

  if(m.type==='snapshot'){if(S.feedKind!==undefined&&(S.feedKind!==m.feed||S.ctf!==m.ctf)){S.feed=[];S.links.clear();S.sel=null;S.unread=0;$('ac').style.display='none';auditData=null;histData=null;S.feedEx=null}

    $('iface').textContent=`${m.iface} · ${m.me.filter(i=>!i.includes(':'))[0]||m.me[0]||'?'}`;setStats(m.stats);renderTab();return}

    const n=m.items.length;m.items.forEach((it,i)=>spawn(it,i*200/Math.max(1,n)));

}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd1=a=>a[Math.random()*a.length|0];

const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function makeQuestion(){const MT=S.features?.mitre||[],keys=Object.keys(EDU);
  const kinds=['edu','edu','port','flag','todo','term'];if(MT.length)kinds.push('tactic');if(S.alerts.length)kinds.push('real','real','real');

function drawRules(){const d=rulesData,el=$('t-rules');

    ${v?`<pre id="rv-${i}" style="margin-top:6px">${esc(r[v])}</pre>${copyBtn('rv-'+i)}`:''}</div>`}).join('')}`;

  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή του κανόνα '+b.dataset.del+' από το rules/local.yaml;'))post('/api/rules/delete',{id:b.dataset.del}).then(r=>{if(r.error)ruleRes=r;loadRules()})});

  h+=d.levels.map(lv=>{const solved=lv.questions.filter(q=>ctfSolved[lv.id+':'+q.id]).length,on=lv.id===d.active;
    return `<div class="card" style="${on?'border-color:#ffd23f':''}"><div class="brow"><b style="color:#fff;font-size:13px">${esc(lv.title)}</b><span class="tag ${{'Εύκολο':'g','Μέτριο':'y','Δύσκολο':'r'}[lv.difficulty]||''}">${esc(lv.difficulty)}</span></div>

      <div class="brow"><span class="sm">${solved}/${lv.questions.length} · ${lv.questions.filter(q=>ctfSolved[lv.id+':'+q.id]).reduce((a,q)=>a+q.points,0)}/${lv.total} πόντοι</span>${on?'<span class="tag y">φορτωμένο</span>':`<button class="b" data-load="${esc(lv.id)}">▶ Φόρτωσε το pcap</button>`}</div>
      <div class="bar"><i style="width:${100*solved/lv.questions.length}%;background:#3ddc97"></i></div>
      ${on||solved?lv.questions.map(q=>{const k=lv.id+':'+q.id,ok=ctfSolved[k];
        return `<div style="border-top:1px solid var(--line);padding:7px 0"><div class="brow"><span style="white-space:normal">${ok?'✅':'❔'} ${esc(q.q)}</span><span class="sm">${q.points}</span></div>
        ${ok?'':q.type==='rule'?`<textarea class="ctf-rule" data-k="${k}" rows="8" spellcheck="false" placeholder="id: slow-scan&#10;match:&#10;  proto: TCP&#10;  ..." style="width:100%;box-sizing:border-box;margin-top:4px;background:#060a12;color:#cfe0f5;border:1px solid var(--line);border-radius:4px;padding:6px;font:12px ui-monospace,Menlo,monospace">${esc(ctfRule[k]||'')}</textarea><button class="b" data-rule="${k}">🧪 Έλεγχος κανόνα</button>`
          :`<div style="display:flex;gap:6px;margin-top:4px"><input class="f ctf-in" data-k="${k}" style="margin:0" value="${esc(ctfIn[k]||'')}" placeholder="απάντηση"><button class="b" data-ans="${k}">Υποβολή</button></div>`}

        ${ctfMsg[k]&&!ok?`<div class="sm" style="margin-top:3px;white-space:normal">${ctfMsg[k]}</div>`:''}</div>`}).join(''):''}</div>`}).join('');

  let h=`<div class="card" style="white-space:normal"><b style="color:#fff">🧭 Από πού ξεκινάω;</b><div class="sm" style="margin-top:3px">Ακολούθησε τα βήματα με τη σειρά. Κάθε κουμπί σε πάει στη σωστή καρτέλα· εκεί, κάθε ειδοποίηση έχει «Πες μου περισσότερα» με εξήγηση.</div></div>`;
  h+=step(1,'Είμαι ασφαλής σε αυτό το Wi‑Fi;',w?`${{ok:'✅',warn:'⚠️',bad:'❌'}[w.level]} ${esc(w.verdict)}${w.wifi&&w.wifi.ssid?' — «'+esc(w.wifi.ssid)+'»':''}`:'δεν έχει ελεγχθεί ακόμα',w?{ok:G,warn:Y,bad:R}[w.level]:D,'wifi','☕ Wi‑Fi','Εκεί: κρυπτογράφηση, ψεύτικα δίκτυα (evil twin), DNS/TLS παγίδες, firewall & VPN του Mac — με οδηγίες διόρθωσης.');
  h+=step(2,'Μου επιτίθεται κάποιος τώρα;',hi?`🔴 ${hi} σοβαρές ειδοποιήσεις`:me?`🟡 ${me} μέτριες ειδοποιήσεις`:al.length?`🟢 μόνο ${al.length} χαμηλές (συνήθως αθώες)`:'🟢 τίποτα ύποπτο',hi?R:me?Y:G,'alerts','⚠ Επιθέσεις','Εκεί: κάθε ειδοποίηση λέει με απλά λόγια αν είναι κακό και τι να κάνεις. «Ποιος είναι;» → όλα για την IP.');
  h+=step(3,'Ποιος είναι στο δίκτυό μου;',`${devs.length} συσκευές${newD?` · <b>${newD} νέες</b> — τις αναγνωρίζεις;`:''}`,newD?Y:G,'devs','📟 Συσκευές','Εκεί: κάθε συσκευή με MAC, κατασκευαστή, τι κάνει. Και στο κουτί «🏠 Το δίκτυό σου» κάτω αριστερά στον χάρτη.');
  h+=step(4,'Πού πάει η κίνησή μου;',`σε ${[...S.hosts.values()].filter(h=>h.kind==='public').length} servers στο Internet`,'#3ec5ff','route','🛣 Διαδρομή','Παρακάτω: διάλεξε ένα site και δες βήμα-βήμα από πού περνά και ποιος βλέπει τι.');
  h+=step(5,'Φαίνομαι στο Internet;',pr?`${['❌','⚠️','🟡','✅'][pr.level]} ανωνυμία: ${esc(pr.label)}`:'πάτα «Έλεγχος διαρροών»',pr?LVL[pr.level][0]:D,'priv','🕵 Ανωνυμία','Εκεί: τι ξέρει κάθε site για σένα, Tor/VPN, διαρροές DNS / IPv6 / WebRTC.');
  h+=step(6,'Πόσο ασφαλές είναι το σπίτι μου;',au?`βαθμός <b>${au.grade}</b> (${au.score}/100)`:'υπολογίζεται…',au?(au.score>=75?G:au.score>=50?Y:R):D,'audit','🛡 Έλεγχος','Εκεί: κωδικοί χωρίς κρυπτογράφηση, επικίνδυνες υπηρεσίες στο LAN, τι να διορθώσεις.');
  h+=step(7,'Θέλω να μάθω / να εξασκηθώ','🎓 → ❓ → 🔴 → 🚩','#b388ff','academy','🎓 Ακαδημία','Σειρά: 🎓 Ακαδημία (CCNA από το μηδέν & IoT security με ESP32/Raspberry Pi, με animations και labs) → ❓ Κουίζ → 🔴 Pentest (σκάναρε το δίκτυό σου, purple-team lab) → 🧩 Κανόνες → 🚩 CTF.');
  h+=`<h3 id="route-h">🛣 Πού πάει η κίνησή σου — βήμα-βήμα</h3>`+routeHTML();
  h+=`<h3>Όλες οι ενότητες</h3>`+cardsHTML();
  el.innerHTML=h;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='route'){$('route-h').scrollIntoView({behavior:'smooth'});return}showTab(g)});
  el.querySelectorAll('.mcard[data-t]').forEach(c=>c.onclick=()=>showTab(c.dataset.t));
  el.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{routeIp=b.dataset.route;S.sel=routeIp;renderHome()});
  const tb=$('rt-trace');if(tb)tb.onclick=()=>{const ip=tb.dataset.ip;traceCache[ip]={loading:true};renderHome();
    post('/api/trace',{ip}).then(j=>{traceCache[ip]=j;if(tab==='home')renderHome()}).catch(e=>{traceCache[ip]={error:String(e)};renderHome()})};
  bindCommon(el)}
function routeHTML(){
  const pub=[...S.hosts.values()].filter(h=>h.kind==='public').sort((a,b)=>(b.bytes_in+b.bytes_out)-(a.bytes_in+a.bytes_out));
  if(!pub.length)return'<div class="sm">Δεν υπάρχει ακόμα κίνηση προς το Internet.</div>';
  if(S.sel&&S.hosts.get(S.sel)?.kind==='public')routeIp=S.sel;
  if(!routeIp||!S.hosts.has(routeIp))routeIp=pub[0].ip;
  const d=S.hosts.get(routeIp),g=d.geo||{},nm=hname(d)||d.ip,hm=S.home||{},meH=[...S.hosts.values()].find(h=>h.me&&!h.ip.includes(':')),gw=S.hosts.get(S.gw);
  const w=wifiData&&wifiData.result,wf=w&&w.wifi,pr=privData&&privData.result,vpn=pr&&pr.vpn;
  const ports=(d.ports||[]).map(p=>p[0]),https=ports.some(p=>[443,8443,853,993,995,465].includes(p))||(d.protos&&(d.protos.HTTPS||d.protos.QUIC)),http=ports.includes(80);
  const dnsH=[...S.hosts.values()].filter(h=>!h.me&&(h.ports||[]).some(p=>p[0]===53)).sort((a,b)=>(b.pkts_in+b.pkts_out)-(a.pkts_in+a.pkts_out))[0];
  const chips=pub.slice(0,10).map(h=>`<button class="b" data-route="${esc(h.ip)}" style="${h.ip===routeIp?'border-color:#3ec5ff;background:#3ec5ff22':''}">${flag(h.geo?.countryCode)} ${esc((hname(h)||h.ip).slice(0,26))}</button>`).join(' ');
  const sees=(t,c)=>`<span class="tag ${c}">${t}</span>`;
  const node=(ic,title,sub,who,extra)=>`<div style="display:flex;gap:10px"><div style="flex:none;width:30px;text-align:center;font-size:18px">${ic}</div>
    <div style="flex:1;min-width:0;white-space:normal;padding-bottom:4px"><b style="color:#fff">${title}</b> <span class="sm">${sub||''}</span>${who?`<div class="sm" style="margin-top:2px">👁 βλέπει: ${who}</div>`:''}${extra||''}</div></div>`;
  const arrow=t=>`<div style="display:flex;gap:10px"><div style="flex:none;width:30px;text-align:center;color:#3ec5ff">↓</div><div class="sm" style="flex:1;white-space:normal;padding:2px 0 6px">${t||''}</div></div>`;
  const tr=traceCache[routeIp];
  let trHTML='';
  if(!tr)trHTML=`<button class="b" id="rt-trace" data-ip="${esc(routeIp)}">📡 Δείξε όλους τους routers στη διαδρομή (traceroute)</button>`;
  else if(tr.loading)trHTML='<div class="sm">⏳ traceroute… (έως 20 δευτ.)</div>';
  else if(tr.error)trHTML=`<div class="sm" style="color:#ff8da0">${esc(tr.error)}</div>`;
  else trHTML=`<div style="margin:4px 0 2px;padding:6px 8px;border-left:2px dashed #3ec5ff55">${tr.hops.map(x=>{const gg=x.geo;return`<div class="sm" style="white-space:normal">${x.n}. ${x.ip?`<b style="color:#cfe0f5">${esc(x.ip)}</b>`:'<span style="color:#6d7f99">* (δεν απαντά)</span>'} ${x.ms!=null?x.ms.toFixed(0)+' ms':''} ${gg?`· ${flag(gg.countryCode)} ${esc(gg.city||'')} · ${esc(gg.isp||'')}`:x.ip&&/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(x.ip)?'· ιδιωτική (σπίτι ή δίκτυο παρόχου)':''}</div>`}).join('')}
    ${tr.reached?'':'<div class="sm" style="margin-top:3px">Τα τελευταία βήματα δεν απαντούν — πολλοί servers (π.χ. GitHub) μπλοκάρουν το traceroute. Συνηθισμένο.</div>'}${tr.demo?' <span class="tag">προσομοίωση</span>':''}</div>`;
  let r=`<div class="sm" style="margin-bottom:6px">Διάλεξε προορισμό (ή κάνε κλικ σε σημείο στον χάρτη):</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">${chips}</div><div class="card">`;
  r+=node('💻','Εσύ',`${esc(meH?.ip||'')}${hm.query?' · δημόσια IP '+esc(hm.query):''}`,'','<div class="sm" style="margin-top:2px">Εδώ ξεκινά: ο browser ή μια εφαρμογή θέλει να μιλήσει με το '+esc(nm)+'.</div>');
  r+=arrow(dnsH?`① Πρώτα ρωτάς τον DNS <b>${esc(who(dnsH.ip))}</b>: «ποια IP έχει το ${esc(nm)};» → <b>${esc(d.ip)}</b>. Αυτό το ερώτημα πάει ${S.hosts.get(dnsH.ip)?.kind==='public'?'στο Internet':'στον router'} συνήθως χωρίς κρυπτογράφηση.`:'① Πρώτα ο υπολογιστής βρίσκει την IP του site μέσω DNS.');
  r+=node('📶',wf?`Wi‑Fi «${esc(wf.ssid||'?')}»`:'Τοπικό δίκτυο (Wi‑Fi / καλώδιο)',wf?esc(SECL[wf.security]||wf.security):'',
    wf&&wf.security==='none'?sees('όλη την κίνηση που δεν είναι HTTPS — το δίκτυο είναι ανοιχτό','r'):sees('ότι υπάρχεις και πόση κίνηση στέλνεις','y')+(w&&w.public?' · σε δημόσιο Wi‑Fi όποιος ξέρει τον κωδικό μπορεί να δει ποια sites':''));
  r+=arrow('② Το πακέτο πάει στον router — η «πόρτα» προς έξω.');
  r+=node('📡','Router',`${esc(S.gw||'')}${gw&&gw.mac?' · '+esc(gw.mac):''}`,sees('σε ποια IP πας, πότε, πόσα δεδομένα','y')+(dnsH?' + '+sees('τα ονόματα των sites (DNS)','y'):''));
  if(vpn)r+=arrow('🔒 Όλα μπαίνουν σε κρυπτογραφημένο τούνελ VPN — από εδώ και πέρα οι ενδιάμεσοι βλέπουν μόνο «VPN».');
  r+=arrow('③ Ο router τα στέλνει στον πάροχο Internet.');
  r+=node('🏢',hm.isp?`Πάροχος: ${esc(hm.isp)}`:'Πάροχος Internet',`${esc(hm.as||'')}${hm.city?' · '+esc(hm.city):''}`,vpn?sees('μόνο ότι μιλάς με VPN','g'):sees('κάθε site που επισκέπτεσαι (IP + όνομα)','y')+' · είναι υποχρεωμένος να κρατά μεταδεδομένα');
  r+=arrow('④ Από εκεί περνά από routers άλλων εταιρειών (backbone, κόμβοι ανταλλαγής) μέχρι τη χώρα του server.'+'<div style="margin-top:4px">'+trHTML+'</div>');
  r+=node('🌍',esc(nm),`${esc(d.ip)} · ${flag(g.countryCode)} ${esc([g.city,g.country].filter(Boolean).join(', '))}${g.isp?' · '+esc(g.isp):''}`,sees(vpn?'την IP του VPN, όχι τη δική σου':'τη δημόσια IP σου ('+esc(hm.query||'?')+') και περίπου πού είσαι',vpn?'g':'y'),
    `<div class="sm" style="margin-top:2px">θύρες ${esc(ports.slice(0,5).join(', ')||'—')} · ↑ ${fmtB(d.bytes_out)} ↓ ${fmtB(d.bytes_in)}</div>`);
  r+=`<div style="margin-top:8px;padding:6px 8px;border-radius:6px;white-space:normal;${http&&!https?'background:#ff3b5c18;border-left:3px solid #ff3b5c':'background:#3ddc9714;border-left:3px solid #3ddc97'}">${http&&!https?'🔓 <b>HTTP χωρίς κρυπτογράφηση</b>: όλοι οι παραπάνω μπορούν να διαβάσουν το περιεχόμενο (σελίδες, φόρμες, κωδικούς).':https?'🔒 <b>Κρυπτογραφημένο (HTTPS/TLS)</b>: σε όλη τη διαδρομή κανείς ενδιάμεσος δεν διαβάζει το περιεχόμενο — βλέπουν μόνο ότι μιλάς με «'+esc(nm)+'» και πόσα δεδομένα.':'ℹ️ Δεν είναι σαφές αν είναι κρυπτογραφημένο — δες τις θύρες στις 🔎 Λεπτομέρειες.'}</div></div>`;
  return r}
</script>
