<!doctype html>
<!-- Εικόνα προεπισκόπησης (Open Graph, 1200×630) για το link του GitHub / του demo. Τη ζωγραφίζει το make_shots.sh. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#060a12;color:#e9f1fc;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{position:relative;background:
  radial-gradient(900px 500px at 85% 20%,#3ec5ff22,transparent 60%),
  radial-gradient(700px 500px at 10% 110%,#b388ff1c,transparent 60%),#060a12}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:40px 40px;
  -webkit-mask-image:radial-gradient(800px 500px at 30% 50%,#000,transparent)}
.l{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.22em;font-size:22px;color:#e9f6ff}
.brand svg{width:46px;height:46px}
h1{font-size:54px;line-height:1.05;letter-spacing:-.02em;font-weight:750}
h1 span{background:linear-gradient(90deg,#3ec5ff,#b388ff);-webkit-background-clip:text;color:transparent}
p{font-size:21px;line-height:1.45;color:#a9b8cf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips b{font-size:14px;font-weight:600;color:#cfe0f5;background:#ffffff0d;border:1px solid #ffffff17;border-radius:999px;padding:6px 13px}
.shot{position:absolute;left:640px;top:70px;width:900px;border-radius:16px;overflow:hidden;border:1px solid #ffffff1f;
  box-shadow:0 40px 90px -20px #000,0 0 0 8px #ffffff06;transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);transform-origin:left center}
.shot img{display:block;width:100%}
</style></head><body><div class="grid"></div>
<div class="l">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke="#3ec5ff" stroke-opacity=".35" stroke-width="1.5"/><circle cx="12" cy="12" r="6" stroke="#3ec5ff" stroke-opacity=".6" stroke-width="1.5"/><path d="M12 12 19 5" stroke="#3ec5ff" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="#3ec5ff"/><circle cx="16.5" cy="8.8" r="1.3" fill="#ff3b5c"/></svg>NETWATCH</div>
  <h1>See everything on <span>your network</span></h1>
  <p>Network monitor &amp; IDS for the home lab — live map, technician toolkit, IoT / MQTT security and a CCNA academy.</p>
  <div class="chips"><b>Python</b><b>ESP32</b><b>MQTT</b><b>Wireshark</b><b>CCNA</b><b>EN / ΕΛ</b></div>
</div>
<div class="shot"><img src="shot.png"></div>
</body></html>
