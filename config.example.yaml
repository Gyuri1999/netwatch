# NetWatch configuration — copy to config.yaml and edit.
#   cp config.example.yaml config.yaml
# Anything you leave out falls back to the built-in defaults.

thresholds:
  alert_cooldown: 60            # seconds before the same alert (type, actor) can fire again
  port_scan:   {count: 20, window: 10}     # distinct (target, port) probes in N seconds
  brute_force: {count: 15, window: 30}     # connections to SSH/RDP/SMB/… in N seconds
  syn_flood:   {count: 300, window: 5}
  icmp_flood:  {count: 100, window: 5}
  ping_sweep:  {count: 30, window: 10}
  arp_sweep:   {count: 40, window: 10}
  arp_flood:   {count: 60, window: 5}
  beaconing:   {min_events: 8, max_jitter: 0.15, min_interval: 10, max_interval: 3600}
  dns_tunnel:  {unique_subdomains: 30, window: 60, min_length: 20, min_entropy: 3.5}
  dga:         {nxdomain: 8, window: 60, min_score: 0.6}
  new_device:  {warmup: 60}     # seconds after the first run starts before new MACs alert

# Turn individual detectors on/off
detectors:
  port_scan: true
  stealth_scan: true
  network_sweep: true          # set false if you use Fing / network scanner apps
  brute_force: true
  syn_flood: true
  icmp_flood: true
  arp_spoofing: true
  arp_flood: true
  rogue_dhcp: true             # set false if you have a second DHCP server (mesh in router mode)
  dns_spoofing: true
  inbound: true
  suspicious_port: true
  beaconing: true
  dns_tunnel: true
  dga: true
  new_device: true
  threat_intel: true
  cleartext_creds: true
  custom_rules: true
  privacy_leaks: true          # live: alert when DNS/IPv6 leaves outside your VPN tunnel
  wifi_guard: true             # auto-check every new Wi‑Fi (contacts captive.apple.com, public DNS names, google/github/cloudflare)
  honeypot: false              # opt-in: fake SSH/Telnet/HTTP/printer ports; anyone who connects raises an alert
# honeypot_ports: [2222, 2323, 8080, 9100]   # choose from 2222 2323 8080 9100 3389 5900

# Never alert on these
allowlist:
  ips: []          # e.g. ["192.168.1.30"]  (your NAS that scans the network)
  macs: []         # e.g. ["aa:bb:cc:dd:ee:ff"]
  domains: []      # e.g. ["apple.com", "googleapis.com"] — also matches subdomains

intel:
  enabled: true
  max_age_hours: 24             # re-download blocklists once a day (cached in data/intel/)
  abuseipdb_key: ""             # optional: free key from https://www.abuseipdb.com/account/api
  # feeds: [...]                # override the default list (Feodo Tracker, Spamhaus DROP, FireHOL level1)

lang: el                        # el | en — language of notifications (macOS / Telegram / ntfy). The web UI has its own 🇬🇧 EN button.

notify:                         # live mode (or --notify)
  min_severity: high            # low | med | high
  cooldown: 30                  # seconds between notifications of the same type
  macos: true                   # Notification Center
  telegram:
    bot_token: ""               # from @BotFather
    chat_id: ""                 # your chat id
  ntfy:                         # push to your phone with the free ntfy app (https://ntfy.sh)
    topic: ""                   # a LONG RANDOM name: on public ntfy.sh anyone who knows it can read your alerts
    # server: https://ntfy.sh   # or your own ntfy server (e.g. an LXC on Proxmox)
    # token: ""                 # access token if your server requires one
  # discord: {webhook: "https://discord.com/api/webhooks/…"}
  # slack:   {webhook: "https://hooks.slack.com/services/…"}
  # webhook: {url: "http://192.168.1.30:8123/api/webhook/netwatch", headers: {X-Token: "…"}}   # JSON POST, http(s) only
  # email:   {host: smtp.gmail.com, port: 587, user: "…", password: "app-password", to: ["you@example.com"]}  # STARTTLS

history:
  path: data/netwatch.db        # SQLite — alerts, traffic per minute, known devices

# Academy terminal: runs only safe, read-only network commands (ping, nmap -sT on private ranges, dig, curl…),
# never with sudo and never as root. Set to false to disable it.
academy_terminal: true

# ESP32 Wi‑Fi sensors (firmware/esp32-sentinel): NetWatch subscribes to their MQTT broker over TLS.
# sensor:
#   mqtt_host: pi-broker.local
#   mqtt_port: 8883
#   ca_file: ~/iot-ca/ca.crt
#   username: netwatch
#   password: "change-me"
#   topic: netwatch/sensor/#

# MQTT guard (📨 MQTT tab): NetWatch connects to your broker with a READ-ONLY user and learns what is normal.
# Broker side: mosquitto_passwd + acl_file "user netwatch / topic read # / topic read $SYS/#", and `log_dest topic`
# in mosquitto.conf so NetWatch can see who connects.
# mqtt_guard:
#   host: 192.168.1.17
#   port: 1883            # 8883 + ca_file once you enable TLS
#   username: netwatch
#   password: ""
#   # ca_file: ~/iot-ca/ca.crt

# Home Assistant (MQTT discovery): NetWatch appears as a device "NetWatch" with entities
#   binary_sensor.netwatch_attack, sensor.netwatch_last_alert, _alerts_hour, _devices, _score
# and every alert is also published as JSON on netwatch/alerts (use it as an MQTT trigger).
# Use a SEPARATE broker user from mqtt_guard, with ACL:
#   user netwatch-ha / topic readwrite homeassistant/# / topic readwrite netwatch/ha/# / topic write netwatch/alerts
#   / topic write netwatch/playbook/#   (full walkthrough: docs/homelab-setup.md)
# homeassistant:
#   host: 192.168.1.17
#   port: 1883
#   username: netwatch-ha
#   password: ""
#   # ca_file: ~/iot-ca/ca.crt

# ⚡ Automatic responses ("when X → do Y"). Nothing runs automatically unless you write it here.
# Actions: block (firewall, expires after block_minutes), notify (forces a notification), mqtt (netwatch/playbook/<name>,
# e.g. to trigger a Home Assistant scene). Never blocks you, the router or the allowlist; max_per_hour caps actions.
# playbooks:
#   - name: Canary → block
#     when: {type: "Καναρίνι ESP32"}       # alert type prefix (string or list); optional sev: high, local: true
#     do: [block, notify]
#     block_minutes: 60
#     dry_run: true                         # start with true: it only logs what it WOULD do

# 🩺 Homelab health (TCP / HTTP / ping every 60 s, TLS expiry for tls: true). The router and your configured broker are
# checked automatically.
# health:
#   - {name: Proxmox, host: 192.168.1.16, port: 8006, tls: true}
#   - {name: MQTT broker, host: 192.168.1.17, port: 1883}
#   - {name: Home Assistant, url: "http://192.168.1.30:8123/"}
#   - {name: ESP32 garden, host: 192.168.1.20, ping: true}

# ───────────── 🏗 Infrastructure (professional NMS features) ─────────────

# 🔕 Maintenance windows: alerts still show on screen but are NOT sent to your phone and playbooks don't run.
# You can also mute for 30′/1h/4h from the 🛠 Ops tab.
# maintenance:
#   - {name: "NAS backup", days: [mon, tue, wed, thu, fri, sat, sun], start: "02:00", end: "04:00"}
#   - {name: "Router upgrade", start: "2026-12-01 22:00", end: "2026-12-01 23:30", hosts: ["192.168.1.1"]}

# 🔑 Read-only tokens (role viewer) for a wall display / Prometheus when NetWatch runs as an agent.
# Use LONG random strings (min 16 chars): python3 -c "import secrets; print(secrets.token_urlsafe(24))"
# api_tokens:
#   - {name: "Living room screen", token: "change-me-long-random", role: viewer}
# Prometheus: scrape http://<netwatch>:8765/metrics (add ?token=… or an Authorization: Bearer header in agent mode).

# 🌊 NetFlow v5/v9 / IPFIX / sFlow collector: point your router / switch / softflowd at this machine.
# flows:
#   enabled: true
#   netflow_port: 2055      # NetFlow / IPFIX (UDP)
#   sflow_port: 6343        # sFlow (UDP)
#   allow: [192.168.1.1]    # accept flows only from these exporters
#   window_min: 30

# 📶 SNMP polling (v2c, read-only community): interfaces, traffic, errors, LLDP/CDP neighbours → topology.
# snmp:
#   enabled: true
#   interval: 60
#   targets:
#     - {name: Router, host: 192.168.1.1, community: public}
#     - {name: Switch, host: 192.168.1.2, community: public}

# 📜 Syslog server (RFC 3164/5424, UDP+TCP). Port 514 needs root, so the default is 5514 — forward to it.
# syslog:
#   enabled: true
#   port: 5514
#   allow: [192.168.1.0/24]
#   keep: 5000
#   rules:                  # extra alerts: regex on the message
#     - {name: "Backup failed", match: "backup failed", sev: med}     # "re:…" for a regex

# 🗂 IPAM (like NetBox / phpIPAM): subnets, DHCP pools, reservations, conflicts.
# ipam:
#   subnets:
#     - {cidr: 192.168.1.0/24, name: LAN, vlan: 1, gateway: 192.168.1.1, dhcp: "192.168.1.100-192.168.1.199"}
#   reserved:
#     - {ip: 192.168.1.17, name: MQTT broker}
#   # leases_file: /var/lib/misc/dnsmasq.leases   # if NetWatch runs on the DHCP server
#   stale_days: 7

# ⏱ Latency (SmokePing-style): ping every minute, median / jitter / loss, worst hours.
# The router and two public DNS servers are added automatically.
# latency:
#   interval: 60
#   targets:
#     - {name: Proxmox, host: 192.168.1.16}

# 🚀 Speed: iperf3 to a host on your LAN (run `iperf3 -s` there) and an optional internet test (Cloudflare).
# speed:
#   iperf_port: 5201
#   seconds: 5
#   interval: 0             # minutes between automatic internet tests (0 = only when you press the button)

# 📡 Wi‑Fi survey (channels, overlap, open networks nearby).
# wifisurvey:
#   interval: 600
#   avoid_dfs: true

# 📦 PCAP ring: the last N seconds of packets in memory; every alert gets a ⬇ .pcap button (60″ before → 30″ after).
# pcap_ring:
#   enabled: true
#   seconds: 300
#   max_mb: 64

# ───────────── 🔒 Security & privacy ─────────────

# 🧅 Tor: reads the control port (localhost only, read-only) to show the 3-hop circuit live.
# Enable in torrc: ControlPort 9051 + CookieAuthentication 1  (Tor Browser already listens on 9151).
# tor:
#   enabled: true
#   control_port: 9051      # omit to try 9051 then 9151
#   # cookie_file: ~/.tor/control_auth_cookie

# 🔒 VPN kill-switch & split-tunnel (macOS/Linux, read-only). On by default in live mode.
# vpnguard:
#   enabled: true
#   window: 30              # seconds to watch for leaks after the VPN drops

# 🔗 WireGuard / Tailscale status (needs `wg show` — root — and/or `tailscale`).
# wireguard:
#   enabled: true
#   stale_min: 5            # a peer with no handshake for this long counts as lost
#   names: {}               # {pubkey-prefix: "Phone"}

# 🔐 Which devices bypass your DNS (DoH/DoT/DoQ). Pass your router / Pi-hole as local_dns.
# encrypted_dns:
#   enabled: true
#   local_dns: [192.168.1.1]
#   allow: []               # device IPs to ignore

# 🔐 Pi-hole or AdGuard Home stats (read-only API).
# dns_filter:
#   type: pihole            # pihole | adguard
#   url: "http://192.168.1.2"
#   password: ""            # Pi-hole v6 app password / admin password (never logged)
#   # user: admin           # AdGuard basic-auth user

# 📥 Import Suricata (eve.json) and Zeek logs into NetWatch's alert list.
# log_import:
#   enabled: true
#   files:
#     - {path: /var/log/suricata/eve.json, type: eve, follow: true}
#     - {path: /opt/zeek/logs/current/notice.log, type: zeek, follow: true}

# 🔏 Certificate Transparency: alert on a new certificate for YOUR domains (crt.sh).
# ct_watch:
#   domains: ["your-site.gr"]
#   interval_h: 6
#   expect_issuers: ["Let's Encrypt"]

# 🧱 Μικρο-τμηματοποίηση IoT: μαθαίνει με ποιους μιλά κανονικά κάθε συσκευή του LAN, βγάζει έτοιμους κανόνες
# firewall (OpenWrt / pfSense / MikroTik / iptables) για να επιτρέπεις ΜΟΝΟ αυτά, και ειδοποιεί όταν μια συσκευή
# σε «παρακολούθηση» μιλήσει με κάτι καινούριο. Παθητικό: δεν αλλάζει ποτέ τον router. Προφίλ: data/iotfw.json.
# iot_firewall:
#   enabled: true
#   learn_hours: 24         # πόσες ώρες «μαθαίνει» κάθε νέα συσκευή
#   alert_severity: med     # βασική σοβαρότητα παράβασης: low | med | high (ανεβαίνει για threat intel / νέα χώρα / ασυνήθιστη θύρα)
#   max_destinations: 200   # όριο προορισμών ανά συσκευή (φραγμένη μνήμη)
#   auto_watch: true        # μετά τη μάθηση οι IoT συσκευές (κάμερες, ESP32, πρίζες, TV…) περνούν αυτόματα σε «παρακολούθηση»
#   ignore: []              # IP ή MAC συσκευών που αγνοούμε

# 📹 Camera exposure check (DEFENSIVE — your own LAN only, private ranges, read-only, never tries passwords).
# camera_scan:
#   enabled: true
#   # subnet: 192.168.1.0/24   # default: auto from your LAN
#   interval_h: 0              # 0 = only when you press the button

# 📷 NetCam Lab: σκόπιμα ευάλωτη ΕΙΚΟΝΙΚΗ IP κάμερα για εξάσκηση σε ηθικό IoT pentesting (τύπου OWASP IoTGoat).
# Ακούει ΠΑΝΤΑ μόνο στο 127.0.0.1 (δεν ρυθμίζεται), ξεκινά μόνο όταν πατήσεις «Έναρξη», σβήνει μόνο της μετά από
# αδράνεια και όταν κλείνει το NetWatch. Κανένα πραγματικό shell — όλα είναι προσομοίωση σε Python.
# Πρόοδος (λυμένες σημαίες, διορθώσεις): data/vulnlab.json (μόνο σε live).
# vulnlab:
#   telnet_port: 2323     # θύρες ≥ 1024
#   http_port: 8089
#   mqtt_port: 18830
#   idle_minutes: 30      # αυτόματο σταμάτημα μετά από τόσα λεπτά χωρίς κίνηση
#   max_conns: 20         # μέγιστες ταυτόχρονες συνδέσεις

# 🟣 Purple team: καμπάνιες προσομοιωμένων επιθέσεων (Atomic Red Team / Caldera) και κάλυψη MITRE ATT&CK.
# Τα πακέτα ΕΓΧΕΟΝΤΑΙ στη μηχανή ανίχνευσης — δεν στέλνεται τίποτα στο δίκτυο. Ιστορικό 20 καμπανιών: data/purple.json (live).
# purple:
#   pace: 1.0             # πραγματικά δευτερόλεπτα ανά σενάριο (ο χρόνος των πακέτων «συμπιέζεται»)

# 🔐 Έλεγχος TLS / SSH (τύπου testssl.sh / ssh-audit): μόνο ιδιωτικές IP, μόνο χειραψίες — καμία εκμετάλλευση.
# Στόχοι: όσα SSH/TLS βρήκε η τελευταία σάρωση ή λίστα ip:θύρα. Αποτελέσματα: data/tlsaudit.json (live).
# tls_audit:
#   workers: 8            # ταυτόχρονοι έλεγχοι
#   timeout: 3            # δευτερόλεπτα ανά σύνδεση

# 💾 Αντίγραφα ρυθμίσεων συσκευών (τύπου Oxidized / RANCID): ssh → εκδόσεις στο data/configs/<id>/ + διαφορές.
# ΜΟΝΟ κλειδιά SSH (BatchMode) — κωδικοί δεν δεχόμαστε. Βάλε το δημόσιο κλειδί σου στη συσκευή:
#   Linux/OpenWrt: ssh-copy-id · Cisco: ip ssh pubkey-chain · MikroTik: /user ssh-keys import (χρήστης ομάδας read).
# Μόνο ιδιωτικές IP. Τα μυστικά (secret, community, key, wpa-psk, password=) κρύβονται σε ό,τι δείχνει το UI.
# Ειδοποίηση «Αλλαγή ρυθμίσεων» σε κάθε πραγματική αλλαγή (νέος χρήστης, telnet, NAT, ACL… → med).
# config_backup:
#   enabled: true
#   every_hours: 24
#   keep: 200               # εκδόσεις ανά συσκευή
#   devices:
#     - {id: core-sw, name: "Core switch", host: 192.168.1.2, vendor: cisco_ios, user: backup}
#     - {id: mikrotik, name: "Router", host: 192.168.1.1, vendor: mikrotik, user: backup, identity_file: ~/.ssh/id_ed25519}
#     - {id: ap-living, name: "AP σαλονιού", host: 192.168.1.3, vendor: openwrt, user: root}
#     - {id: pi, name: "Raspberry Pi", host: 192.168.1.16, vendor: linux, user: pi, port: 22}
#     - {id: fw, name: "pfSense", host: 192.168.1.254, vendor: generic, user: admin, command: "cat /conf/config.xml"}

# 🔌 «Πού είναι συνδεδεμένο;» (MAC → switch → θύρα → VLAN): δεν έχει δικό του μπλοκ — διαβάζει τα switch του
# snmp.targets παραπάνω (ίδιο community, μόνο ανάγνωση) κάθε 5′: BRIDGE-MIB / Q-BRIDGE FDB, ifName/ifAlias, LLDP/CDP.
# Uplink = θύρα με γείτονα switch/AP/router ή > 8 MAC. Cisco IOS (BRIDGE-MIB ανά VLAN): πρόσθεσε στον στόχο vlans:
#     - {name: core-sw, host: 192.168.1.2, community: "…", vlans: [10, 20, 30]}   # διαβάζεται και ως community@<vlan>

# ⏳ Υπενθυμίσεις λήξης (πιστοποιητικά, domains, άδειες, εγγυήσεις, συμβόλαια, firmware). Αυτόματα: ό,τι ξέρουν ήδη
# ο έλεγχος TLS, οι έλεγχοι διαθεσιμότητας (health) και το ct_watch. Ειδοποίηση «Λήξη πλησιάζει» στις 30/7/1/0 μέρες.
# expiry:
#   certs: ["192.168.1.17:5001", "nas.home.lan:443"]     # πιστοποιητικά που ελέγχονται κάθε 12 ώρες
#   domains: ["example-homelab.gr"]                       # RDAP (rdap.org) μία φορά τη μέρα· το .gr δεν έχει RDAP → items
#   items:
#     - {name: "Cisco SmartNet core-sw", date: 2027-03-01, kind: contract, note: "CON-SNT-WS-C2960"}
#     - {name: "Εγγύηση NAS", date: 2028-05-10, kind: warranty}
#     - {name: "Αλλαγή μπαταρίας UPS", date: 2027-01-15, kind: other}
#   # kind: license | warranty | contract | firmware | domain | cert | other — και από το UI (data/expiry.json)

# 🧱 Έλεγχος διαχωρισμού / Segmentation test: είναι πράγματι απομονωμένα τα VLAN που πρέπει; Από εκεί που τρέχει
# το NetWatch δοκιμάζει συνδέσεις TCP (χωρίς δεδομένα) σε θύρες διαχείρισης άλλων ζωνών και τις συγκρίνει με την
# πολιτική. Only private ranges (RFC1918 / ULA fc00::/7) — public ranges are rejected; the internet is never probed.
# Ελέγχονται μόνο οι κανόνες με from = ζώνη αυτού του μηχανήματος· για τις άλλες ζώνες τρέξε NetWatch μέσα σε εκείνο
# το VLAN ή: python3 segcheck.py --config config.yaml --post https://<netwatch>:8765 --token <agent-token> --cafile agent.crt
# Παραβίαση → ειδοποίηση «Διαρροή διαχωρισμού VLAN» και εύρημα στην αναφορά pentest.
# segmentation:
#   zones:
#     lan: "192.168.1.0/24"
#     iot: {cidr: "192.168.30.0/24", vlan: 30}         # vlan: προαιρετικό, μπαίνει στο παράδειγμα Cisco ACL
#     guest: {cidr: "192.168.20.0/24", vlan: 20}
#     mgmt: "192.168.99.0/24"
#   policy:                                           # χωρίς policy: lan/mgmt → παντού, όλα τα άλλα απομονωμένα
#     - {from: guest, to: lan, allow: false}
#     - {from: guest, to: mgmt, allow: false}
#     - {from: iot, to: lan, allow: false}
#     - {from: iot, to: internet, allow: true}         # «internet» = ψευδο-ζώνη, δεν δοκιμάζεται
#     - {from: lan, to: iot, allow: true}
#   # ports: [22, 23, 80, 443, 445, 1883, 3389, 5000, 5001, 5900, 8006, 8080, 8443, 9100]   # μόνο TCP (προεπιλογή)
#   # targets: {lan: ["192.168.1.17", "192.168.1.16"]}  # αλλιώς: γνωστές συσκευές της ζώνης + .1 (έως 32)
#   # source: guest                                   # αλλιώς: η ζώνη που περιέχει την IP αυτού του μηχανήματος
#   # interval_hours: 12                              # αυτόματος έλεγχος (0 = μόνο από το UI)
