<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NetWatch Ακαδημία</title>
<meta name="description" content="CCNA 200-301 και IoT security στα ελληνικά: μαθήματα, κάρτες, κουίζ, subnetting και το 10λεπτο της ημέρας. Δουλεύει και offline.">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ακαδημία">
<link rel="manifest" href="manifest.webmanifest">
<script src="i18n.js"></script>
<link rel="icon" href="academy/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="academy/icon-180.png">
<style>
:root{--bg:#05080f;--panel:#0b111c;--panel2:#101828;--line:#1c2638;--txt:#cfe0f5;--dim:#6d7f99;--cyan:#3ec5ff;--green:#3ddc97}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#05080fee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header img{width:28px;height:28px;border-radius:7px}
header b{color:#fff;font-size:16px;flex:1}
main{max-width:860px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.sm{font-size:12px;color:var(--dim)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:#1a2538}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
button.b{background:#13203a;border:1px solid #2d3b55;color:var(--txt);padding:7px 12px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;touch-action:manipulation}
button.b:hover,button.b:active{border-color:var(--cyan)}
button.b[disabled]{opacity:.45}
#net{font-size:11px}
footer{text-align:center;padding:10px}
footer a{color:var(--cyan)}
</style>
</head>
<body>
<header><img src="academy/icon.svg" alt=""><b>🎓 Ακαδημία</b><span id="net" class="sm"></span><button class="b" id="inst" hidden>📲 Εγκατάσταση</button><button class="b" data-langswitch></button></header>
<main><div id="ac"><div class="empty">φόρτωση μαθημάτων…</div></div>
<footer class="sm">Η πρόοδος μένει μόνο σε αυτή τη συσκευή. Μέρος του NetWatch.</footer></main>
<script>
// Η ίδια μηχανή με το NetWatch, χωρίς server: τα αρχεία έρχονται από το academy/files.json (ή academy/en/ στα αγγλικά).
window.ACADEMY_CFG = { standalone: true, base: 'academy/', filesUrl: 'academy/files.json' };
</script>
<script src="academy/engine.js"></script>
<script>
(function () {
  const el = document.getElementById('ac');
  ACADEMY.render(el);
  // συντόμευση από την αρχική οθόνη: academy.html?daily=1
  if (/[?&]daily=1/.test(location.search)) ACADEMY.openDaily();
  const net = document.getElementById('net');
  const upd = () => { net.textContent = navigator.onLine ? '' : '✈ offline'; };
  addEventListener('online', upd); addEventListener('offline', upd); upd();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  let ev; const ib = document.getElementById('inst');
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; ib.hidden = false; });
  ib.onclick = () => { if (ev) { ev.prompt(); ev = null; ib.hidden = true; } };
})();
</script>
</body>
</html>
